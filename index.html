    parts.push('【上一段正文（只用来接上文，不要重复）】\n' + last.slice(-700));
    parts.push('【玩家这回合写的】' + (R.input || '（点了选项）'));
    parts.push(`【本回合结算】
时辰：${shichenOf(R.timeFrom)} → ${shichenOf(R.timeTo)}
地点：${R.scene.loc}
发生的事（按顺序）：
${lines.map(t => '- ' + t).join('\n') || '- 没什么新东西'}`);
    if (R.must.length) parts.push('【必须写进去】\n' + R.must.map(t => '- ' + t).join('\n'));
    if (R.dmg > 0) parts.push(`【伤】这回合伤得${sev(R.dmg)}。${G.player.hp <= 30 && G.player.hp > 0 ? '人已经快撑不住了。' : ''}`);
    if (R.rolls.length) parts.push('【做成没做成】' + R.rolls.map(r => `${r.label || '那一下'}：${r.ok ? '成了' : r.graze ? '差一点，擦着过去' : '没成'}`).join('；'));
    if (R.interrupted) parts.push('【被打断】正文写到这件事发生为止，后面的' + (R.cancelled ? '（玩家原本还想' + R.cancelled.map(s => ACTION_TYPES[s.type]).join('、') + '）' : '') + '都没做。');
    const C2 = C;
    const known = Object.keys(run.clues).filter(id => C2.clues[id]).map(id => C2.clues[id].text);
    parts.push('【玩家知道的事】\n' + (known.map(t => '- ' + t).join('\n') || '- 还没什么'));
    const banned = activeSpoilers(G, R);
    if (banned.length) parts.push('【玩家还不知道，正文和选项里都不许出现的词】' + banned.join('、'));
    const seenObjs = Object.keys(run.s.__seen || {}).map(id => C.objects[id] && C.objects[id].name).filter(Boolean);
    if (seenObjs.length && !ending) parts.push('【玩家已经仔细看过的东西，选项别再让他看】' + seenObjs.join('、'));
    if (R.notes.length) parts.push('【导演备注：只用来把握分寸，不要直接写出来】\n' + R.notes.map(t => '- ' + t).join('\n'));
    parts.push(`【此刻】${R.scene.clock}，${R.scene.loc}。看得见：${R.scene.objs.join('、') || '没什么'}。人：${R.scene.npcs.join('；') || '只有你'}。${R.scene.extra || ''}`);
    if (ending) parts.push(`【结局】${ending.title}\n结局要写到的东西：${ending.beat}`);
    if (!ending) parts.push('【动作单可用的 id】\n' + gl);
    if (retryNote) parts.push('【上一稿的问题，这次改掉】' + retryNote);
    return [
      { role: 'system', content: sys },
      { role: 'user', content: parts.join('\n\n') },
    ];
  },

  homecoming(G, ending) {
    const P = G.player;
    return [
      { role: 'system', content: '你给一款中式恐怖游戏写过场，学夜不语的写法。第一人称“我”，100 到 160 字，写“我”从那一夜回到现实的第一个早上。现代城市，平常日子。“我”想把那一夜当成一场梦，可有一处很小的、没散干净的不对劲。不解释，停在那个细节上。只输出正文，不要标题，不要引号。' },
      { role: 'user', content: `主角：${P.age}岁，${P.gender}，${P.job}。刚经历的那一夜：${Engine.caseOf(G).title}，结局「${ending.title}」。可以用的余波：${ending.echo || '水，名字，灯'}` },
    ];
  },
};

/* 不靠模型的兜底叙述：把结算拼成能读的短文 */
function plainNarrate(G, R, ending) {
  const out = [];
  for (const l of R.lines) out.push(l.text);
  for (const m of R.must) out.push(m);
  if (ending) out.push(ending.beat);
  return out.join('\n\n') || '一时没什么动静。';
}

'use strict';

/* 离线解析：没接模型时用，也是测试用的假模型。只认得最常见的说法。 */
const OfflineParser = {
  parse(G, text) {
    const C = Engine.caseOf(G);
    const g = Engine.glossary(G);
    const t = String(text || '').trim();
    const said = (/[「“"](.+?)[」”"]/.exec(t) || [])[1];
    const findIn = (ids, getNames) => {
      let best = null, bestLen = 0;
      for (const id of ids) for (const nm of getNames(id)) if (nm && t.includes(nm) && nm.length > bestLen) { best = id; bestLen = nm.length; }
      return best;
    };
    const obj = findIn(g.objs, id => [C.objects[id].name, ...(C.objects[id].alias || [])]);
    const npc = findIn(g.npcs, id => [C.npcs[id].name, ...(C.npcs[id].alias || [])]);
    const loc = findIn(g.exits, id => [C.locations[id].name, ...(C.locations[id].alias || [])]);
    const flags = {};
    for (const f of g.flags) flags[f.key] = f.offline ? !!f.offline(t, said || '') : false;
    const step = (() => {
      if (/^(我)?(等|守着|坐着等|接着守)/.test(t)) {
        const cn = { 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10, 十一: 11, 十二: 12 };
        const m = /(\d{1,2}|十[一二]?|[一二两三四五六七八九十])\s*[:：点](\d{2}|半)?/.exec(t);
        if (m) {
          const h = /\d/.test(m[1]) ? +m[1] : cn[m[1]];
          const mm = m[2] === '半' ? '30' : (m[2] || '00');
          return { type: 'wait', until: `${String(h).padStart(2, '0')}:${mm}` };
        }
        if (/天亮|晨钟|卯时/.test(t)) return { type: 'wait', until: C.dawnHHMM || '06:00' };
        return { type: 'wait', minutes: 30 };
      }
      if (/我知道什么|回想|想想/.test(t)) return { type: 'recall' };
      if (/写/.test(t) && obj) return { type: 'write', target: obj, text: said || (/写(?:上|成|下)?(.+)$/.exec(t) || [])[1] || '' };
      if (said || /^(说|喊|问|答|回|应|念)/.test(t) || /(对|朝|冲).{0,6}(说|喊|问)/.test(t)) {
        return { type: 'say', to: npc || (g.npcs.includes('voice') ? 'voice' : 'none'), text: said || t, topic: topicGuess(C, npc, t), flags };
      }
      if (/拦|捂|按住他|别让/.test(t) && npc) return { type: 'stop', to: npc, how: t };
      if (/撬|砸|推|按住|挣/.test(t)) return { type: 'force', target: obj || npc, how: t };
      if (/打开|开门|开棺|掀开/.test(t)) return { type: 'open', target: obj };
      if (/点|添|加油|吃|用/.test(t)) {
        const item = Object.keys(SHOP_BY_ID).find(k => t.includes(SHOP_BY_ID[k].name));
        return { type: 'use', target: obj, item };
      }
      if (/(拿|取|揣|捡)/.test(t) && obj) return { type: 'take', target: obj };
      if (/(去|走|到|回)/.test(t) && loc) return { type: 'move', target: loc };
      if (/(给|递)/.test(t) && obj && npc) return { type: /看/.test(t) ? 'show' : 'give', target: obj, to: npc };
      if (/(看|查|翻|找|摸|闻|瞧)/.test(t) && (obj || npc)) return { type: 'examine', target: obj || npc };
      if (/(看|四周|环顾)/.test(t)) return { type: 'look' };
      if (/(躲|跑)/.test(t)) return { type: 'hide', target: loc };
      return { type: 'other', text: t };
    })();
    return Engine.sanitize(G, [step]);
  },
};
function topicGuess(C, npc, t) {
  if (!npc || !C.npcs[npc].topics) return 'chat';
  const kw = C.npcs[npc].topicKeywords || {};
  for (const [k, re] of Object.entries(kw)) if (re.test(t)) return k;
  return 'chat';
}

const Turn = {
  busy: false,
  pendingNar: null,

  async play(input) {
    const G = App.G;
    if (this.busy || !G || !G.run || G.run.over) return;
    this.busy = true;
    const inputText = input.text || (input.option && input.option.label) || '';
    UI.setBusy(true, '你想了一下……');
    try {
      let steps = null, pause = '';
      if (input.option && Array.isArray(input.option.steps) && input.option.steps.length) steps = Engine.sanitize(G, input.option.steps);
      if (!steps || !steps.length) {
        if (App.cfg.offline) steps = OfflineParser.parse(G, inputText);
        else {
          const obj = await LLM.chat(Prompts.understand(G, inputText), { temperature: 0.1, maxTokens: 1200, tag: 'understand' });
          steps = Engine.sanitize(G, obj && obj.steps);
          pause = (obj && obj.pause) || '';
        }
      }
      if (!steps.length) steps = [{ type: 'wait', minutes: 5, flags: {} }];
      const W = clone(G);
      const R = Engine.exec(W, steps, inputText);
      R.pause = pause;
      if (pause) R.notes.push('玩家还有个条件没定：「' + pause + '」。写到条件前为止，不要替他判断条件。');
      await this.narrateAndCommit(W, R);
    } catch (e) {
      console.error(e);
      UI.toast(e.message || String(e));
      UI.setBusy(false);
    } finally {
      this.busy = false;
    }
  },

  endingOf(W, R) {
    const C = Engine.caseOf(W);
    if (R.ending) return Object.assign({ id: R.ending }, C.endings[R.ending]);
    if (R.dead) return { id: 'dead', title: '死', beat: (C.deathBeat ? C.deathBeat(W.run.s, R.deathCause) : '') || R.deathCause || '你死了。', points: 0, dead: true };
    return null;
  },

  async narrateAndCommit(W, R, forcePlain = false) {
    const ending = this.endingOf(W, R);
    let nar = null;
    UI.setBusy(true, '墨还没干……');
    if (App.cfg.offline || forcePlain) {
      nar = { text: plainNarrate(W, R, ending), options: [] };
    } else {
      try {
        nar = await this.narrate(W, R, ending);
      } catch (e) {
        this.pendingNar = { W, R };
        UI.setBusy(false);
        UI.narrationFailed(e.message || String(e));
        return;
      }
    }
    this.commit(W, R, nar, ending);
  },

  async narrate(W, R, ending) {
    const C = Engine.caseOf(W);
    let note = '';
    for (let i = 0; i < 3; i++) {
      const raw = await LLM.chat(Prompts.narrate(W, R, { ending, retryNote: note }), { json: false, temperature: 0.85, maxTokens: 3000, tag: 'narrate' });
      const nar = parseNarration(raw);
      if (!nar.text || nar.text.length < 30) { note = '上一稿没有正文。先写正文，再写【选项】。'; console.warn('叙事原文', raw); continue; }
      const bad = activeSpoilers(W, R).filter(w => nar.text.includes(w));
      if (bad.length && i < 2) { note = `正文提前写出了玩家还不知道的东西：${bad.join('、')}。删掉。`; continue; }
      return nar;
    }
    throw new LLMError('模型这一段写得不对，重试一下。', 'quality');
  },

  commit(W, R, nar, ending) {
    const run = W.run;
    run.chapters.push({ turn: run.turn, input: R.input, text: nar.text, clock: R.timeTo, dmg: R.dmg, clues: R.clues.slice() });
    if (ending) {
      run.options = [];
      this.settle(W, ending);
    } else {
      run.options = buildOptions(W, nar.options || []);
    }
    App.G = W;
    saveGame(W);
    this.pendingNar = null;
    UI.setBusy(false);
    UI.renderNight(true);
  },

  settle(W, ending) {
    const cid = W.run.caseId;
    if (ending.dead) {
      W.run.result = { dead: true, title: ending.title };
      return;
    }
    W.player.points += ending.points || 0;
    W.player.hp = 100;
    W.cleared[cid] = { ending: ending.id, title: ending.title, points: ending.points || 0 };
    W.run.result = { dead: false, title: ending.title, points: ending.points || 0, id: ending.id };
  },

  retryNarration() {
    if (!this.pendingNar) return;
    const { W, R } = this.pendingNar;
    this.narrateAndCommit(W, R);
  },
  plainNarration() {
    if (!this.pendingNar) return;
    const { W, R } = this.pendingNar;
    this.narrateAndCommit(W, R, true);
  },
};


/* 叙事原文 → 正文 + 选项。格式：正文 … 【选项】 每行「选项文字 || [动作单]」。也兼容模型硬回 JSON。 */
function parseNarration(raw) {
  let t = String(raw || '').trim().replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  if (t.startsWith('{')) {
    const o = extractJSON(t);
    if (o && o.text) return { text: String(o.text).trim(), options: Array.isArray(o.options) ? o.options : [] };
    const m = /"text"\s*:\s*"([\s\S]*?)"\s*,\s*"options"/.exec(t);
    if (m) return { text: m[1].replace(/\\n/g, '\n').replace(/\\"/g, '"'), options: [] };
  }
  const parts = t.split(/\n\s*[*#]*\s*(?:【选项】|选项\s*[:：])\s*[*#]*\s*\n?/);
  let text = parts[0].replace(/^(?:【?正文】?[:：]?)\s*/, '').trim();
  const options = [];
  if (parts[1]) {
    for (const line of parts[1].split('\n')) {
      const l = line.trim().replace(/^(?:[-*•]|\d+[.、)）]|[一二三四][、.])\s*/, '');
      if (!l) continue;
      const k = l.indexOf('||');
      const label = (k >= 0 ? l.slice(0, k) : l).trim();
      let steps = [];
      if (k >= 0) {
        const a = extractJSON(l.slice(k + 2).trim(), '[');
        if (Array.isArray(a)) steps = a;
        else { const o = extractJSON(l.slice(k + 2).trim()); if (o && Array.isArray(o.steps)) steps = o.steps; else if (o && o.type) steps = [o]; }
      }
      if (label && /[\u4e00-\u9fff]/.test(label)) options.push({ label: label.replace(/^\*+|\*+$/g, '').trim(), steps });
    }
  }
  return { text, options };
}

/* 选项把关：剧透的、指向还没见过的东西的、反复看同一样的，扔掉；再补一条往前走的。 */
function buildOptions(W, narOpts) {
  const C = Engine.caseOf(W), run = W.run;
  const banned = activeSpoilers(W);
  const hiddenNames = Object.keys(C.objects).filter(id => !Engine.objVisible(W, id) && !(run.s.__seen || {})[id]).map(id => C.objects[id].name).filter(n => n.length >= 2);
  const seen = run.s.__seen || {};
  const pend = run.pending && run.pending.kind;
  const crisis = (pend && pend !== 'call') || (C.inCrisis && C.inCrisis(run.s, run));
  const out = [];
  const lastInput = (run.chapters[run.chapters.length - 1] || {}).input || '';
  for (const o of narOpts) {
    const label = String((o && o.label) || '').trim().replace(/^「(.*)」$/, '$1').slice(0, 60);
    if (!label) continue;
    if (banned.some(w => label.includes(w))) continue;
    if (hiddenNames.some(n => label.includes(n))) continue;
    let steps = Engine.sanitize(W, o.steps || []);
    if (steps.some(st => !Engine.stepOk(W, st))) steps = [];
    if (steps.some(st => st.text && banned.some(w => st.text.includes(w)))) continue;
    if (steps.length === 1 && steps[0].type === 'examine' && (seen[steps[0].target] || 0) >= 2) continue;
    if (label === lastInput) continue;
    out.push({ label, steps });
    if (out.length >= 3) break;
  }
  const sug = Engine.suggest(W).filter(o => o.label !== lastInput);
  if (crisis) {
    // 要命的时候，引擎知道的出路放前头，模型写的往后排
    const merged = sug.slice(0, 3);
    for (const o of out) if (merged.length < 4 && !merged.some(m => m.label === o.label)) merged.push(o);
    return merged.slice(0, 4);
  }
  // 补一条引擎知道的、还没碰过的路子
  const fresh = sug.find(s => !out.some(o => o.label === s.label) && (s.prefill || (s.steps.length && ['examine', 'move', 'open', 'say', 'write', 'use', 'give', 'show', 'take'].includes(s.steps[0].type) && !(s.steps[0].type === 'examine' && seen[s.steps[0].target]))));
  if (fresh && out.length < 3) out.push(fresh);
  for (const s of sug) { if (out.length >= 3) break; if (!out.some(o => o.label === s.label)) out.push(s); }
  // 最后一条：等下去
  if (!pend && C.waitOption) out.push(C.waitOption(run.s, run));
  return out.slice(0, 4);
}

/* 剧透词：案件给的清单，减去玩家已经亲眼看到过的（线索、已写出的正文、这回合的结算） */
function activeSpoilers(W, R) {
  const C = Engine.caseOf(W), run = W.run;
  const list = C.spoilers ? C.spoilers(run.s, run) : [];
  if (!list.length) return list;
  const seenText = [
    ...Object.keys(run.clues).map(id => (C.clues[id] || {}).text || ''),
    ...run.chapters.map(c => c.text),
    ...(R ? [...R.must, ...R.lines.map(l => l.text)] : []),
  ].join('\n');
  return list.filter(w => !seenText.includes(w));
}

function dialSVG(min, size = 74) {
  const m = ((min % 1440) + 1440) % 1440;
  const ang = (m / 1440) * 360;
  const cur = Math.floor((((min + 60) % 1440) + 1440) % 1440 / 120);
  const c = 37, r = 28;
  let t = '';
  SHICHEN.forEach((ch, i) => {
    const a = (i * 30 - 90) * Math.PI / 180;
    t += `<text x="${(c + r * Math.cos(a)).toFixed(1)}" y="${(c + r * Math.sin(a) + 3.5).toFixed(1)}" text-anchor="middle" class="${i === cur ? 'now' : ''}">${ch}</text>`;
  });
  const ha = (ang - 90) * Math.PI / 180;
  return `<svg class="dial" viewBox="0 0 74 74" width="${size}" height="${size}" aria-label="${shichenOf(min)}">
    <circle cx="37" cy="37" r="35" fill="none" stroke="rgba(217,204,178,.18)"/>
    <circle cx="37" cy="37" r="19" fill="none" stroke="rgba(217,204,178,.08)"/>
    ${t}
    <line class="hand" x1="37" y1="37" x2="${(37 + 17 * Math.cos(ha)).toFixed(1)}" y2="${(37 + 17 * Math.sin(ha)).toFixed(1)}"/>
    <circle cx="37" cy="37" r="2" fill="#c6523f"/></svg>`;
}

            <button class="btn" data-a="reroll">全部重抽</button>
            <button class="btn" data-a="reattr">只重抽四项</button>
            <button class="btn" data-a="rejob">只重抽身份</button>
          </div>
          <label class="field">别人怎么叫你（可以不填，正文里一律是"你"）
            <input id="call" maxlength="8" value="${esc(ch.call || '')}" placeholder="比如：小陈、老周">
          </label>
          <div class="field">死了以后
            <div class="mode-pick">
              <label><input type="radio" name="mode" value="normal" ${mode === 'normal' ? 'checked' : ''}>普通<small>可以从那一夜开头重来</small></label>
              <label><input type="radio" name="mode" value="hard" ${mode === 'hard' ? 'checked' : ''}>硬核<small>死了就结束，真相不给看</small></label>
            </div>
          </div>
          <div class="create-row" style="margin-top:2em">
            <button class="btn primary" data-a="go">就是这个人</button>
            <button class="btn" data-a="back">回去</button>
          </div>
        </div></div>`;
    };
    draw();
    $('#app').onclick = e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      const call = $('#call')?.value || '';
      const m = $('input[name=mode]:checked'); if (m) mode = m.value;
      if (a === 'reroll') { ch = rollCharacter(); ch.call = call; draw(); }
      if (a === 'reattr') { ch = rollCharacter({ gender: 1, ident: 1, age: 1 }, ch); ch.call = call; draw(); }
      if (a === 'rejob') { ch = rollCharacter({ attrs: 1, gender: 1 }, Object.assign({}, ch, { job: null })); ch.call = call; draw(); }
      if (a === 'back') UI.title();
      if (a === 'go') {
        ch.call = call;
        if (loadGame() && !confirm('会覆盖现在的存档。接着吗？')) return;
        App.G = newGame(ch, mode);
        startNight(App.G);
        saveGame(App.G);
        App.enterGame();
      }
    };
  },

  /* ---------- 夜 ---------- */
  renderNight(fresh = false) {
    const G = App.G, run = G.run, C = CASES[run.caseId], P = G.player;
    const glow = clamp(P.hp / 100, 0, 1);
    document.documentElement.style.setProperty('--glow', String(glow));
    if (UI.lastHp != null && P.hp < UI.lastHp) UI.flashHurt();
    UI.lastHp = P.hp;

    if (!$('.night')) UI.buildNight();
    const low = P.hp <= 30 ? 'low' : '';
    $('.dial-wrap').innerHTML = `${dialSVG(run.min)}<div><div class="time-big">${shichenOf(run.min)}</div><div class="time-small">${hhmm(run.min)}　第${['一', '二', '三'][G.nightIdx]}夜</div></div>`;
    $('.lampbar').innerHTML = `${ICON.flame(glow)}<div class="meter"><i class="${low}" style="width:${P.hp}%"></i></div><span class="hpn">命 ${P.hp}</span>`;
    $('.attrs-mini').innerHTML = Object.entries(ATTRS).map(([k, n]) => `<div><b>${P.attrs[k]}</b>${n}</div>`).join('');
    $('.topbar').innerHTML = `${dialSVG(run.min, 38)}<div class="tt"><div>${shichenOf(run.min)}</div><div>${C.title} · ${hhmm(run.min)}</div></div>
      <div class="mini-hp"><div class="meter"><i class="${low}" style="width:${P.hp}%"></i></div></div>
      <button class="icon-btn" data-a="settings" aria-label="设置">${ICON.gear}</button>`;

    // 正文
    const head = `<div class="case-head"><span class="seal">${C.title.slice(0, 2)}<br>${C.title.slice(2, 4)}</span><div><div class="t">${C.title}</div><div class="meta">第${['一', '二', '三'][G.nightIdx]}夜，${'一二三'[C.star - 1]}星</div></div></div>
      <div class="brief">你的身份：<b>${C.role}</b><br>要做的事：<b>${C.task}</b></div>`;
    const chs = run.chapters.map((c, i) => `<section class="chapter ${fresh && i === run.chapters.length - 1 ? 'fresh' : ''}" id="ch${i}">
        ${c.input ? `<div class="you-said">${esc(c.input)}</div>` : ''}${paras(c.text)}</section>`).join('');
    $('.story-inner').innerHTML = head + chs + `<div class="fail-slot"></div><div class="busy"><span class="dot"></span><span class="busy-t"></span></div>`;

    // 选项
    const over = !!run.over;
    $('.opts').innerHTML = over ? '' : (run.options || []).map((o, i) => `<button class="opt" data-opt="${i}">${esc(o.label)}</button>`).join('');
    $('.say-form').style.display = over ? 'none' : '';
    if (over) $('.opts').innerHTML = `<div class="end-gate"><button class="btn primary" data-a="showend">${run.result && run.result.dead ? '合上这一页' : '天亮了'}</button></div>`;

    UI.renderPanes();
    if (fresh) {
      const last = $('#ch' + (run.chapters.length - 1));
      if (last) setTimeout(() => last.scrollIntoView({ block: 'start', behavior: 'smooth' }), 30);
    } else {
      const st = $('.story'); st.scrollTop = run.chapters.length <= 1 ? 0 : st.scrollHeight;
    }
  },

  buildNight() {
    $('#app').innerHTML = `
      <div class="night">
        <div class="topbar"></div>
        <aside class="side mobile-hidden">
          <div class="dial-wrap"></div>
          <div class="lampbar"></div>
          <div class="attrs-mini"></div>
          <div class="tabs" role="tablist">
            <button role="tab" data-tab="clues">线索</button>
            <button role="tab" data-tab="bag">行囊</button>
            <button role="tab" data-tab="me">你</button>
          </div>
          <div class="panes">
            <div class="pane" data-pane="clues"></div>
            <div class="pane" data-pane="bag"></div>
            <div class="pane" data-pane="me"></div>
          </div>
          <div class="side-foot"><button class="btn small" data-a="settings">设置</button><button class="btn small" data-a="home">封面</button></div>
        </aside>
        <main class="story" aria-live="polite"><div class="story-inner"></div></main>
        <footer class="act"><div class="act-inner">
          <div class="opts"></div>
          <form class="say-form"><textarea rows="1" placeholder="你想做什么，或者说什么……" aria-label="你的行动"></textarea><button class="btn primary" type="submit">落笔</button></form>
        </div></footer>
        <nav class="tabbar" role="tablist">
          <button data-mtab="story" aria-selected="true">正文</button>
          <button data-mtab="clues">线索</button>
          <button data-mtab="bag">行囊</button>
        </nav>
      </div>
      <div class="hurt-flash"></div>`;
    const app = $('#app');
    app.onclick = e => {
      const opt = e.target.closest('[data-opt]');
      if (opt) {
        const o = App.G.run.options[+opt.dataset.opt];
        if (o && o.prefill) { const ta = $('.say-form textarea'); ta.value = o.prefill; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); return; }
        if (o) { UI.lockOpts(); Turn.play({ option: o }); }
        return;
      }
      const tab = e.target.closest('[data-tab]');
      if (tab) { UI.tab = tab.dataset.tab; UI.renderPanes(); return; }
      const mt = e.target.closest('[data-mtab]');
      if (mt) { UI.setMobileTab(mt.dataset.mtab); return; }
      const use = e.target.closest('[data-use]');
      if (use) { UI.setMobileTab('story'); Turn.play({ option: { label: '用' + SHOP_BY_ID[use.dataset.use].name, steps: [{ type: 'use', item: use.dataset.use }] } }); return; }
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a === 'settings') UI.settings();
      if (a === 'home') UI.title();
      if (a === 'showend') UI.showNightEnd();
      if (a === 'retry') { $('.fail-slot').innerHTML = ''; Turn.retryNarration(); }
      if (a === 'plain') { $('.fail-slot').innerHTML = ''; Turn.plainNarration(); }
    };
    const form = $('.say-form'), ta = $('.say-form textarea');
    form.onsubmit = e => {
      e.preventDefault();
      const v = ta.value.trim();
      if (!v || Turn.busy) return;
      ta.value = ''; ta.style.height = '';
      UI.lockOpts();
      Turn.play({ text: v });
    };
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(min-width: 821px)').matches) { e.preventDefault(); form.requestSubmit(); }
    });
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; });
  },

  setMobileTab(t) {
    UI.mobileTab = t;
    $$('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.mtab === t ? 'true' : 'false'));
    const side = $('.night .side'), act = $('.night .act');
    if (t === 'story') { side.classList.add('mobile-hidden'); act.classList.remove('mobile-hidden'); }
    else { side.classList.remove('mobile-hidden'); act.classList.add('mobile-hidden'); UI.tab = t; UI.renderPanes(); }
  },

  renderPanes() {
    const G = App.G, run = G.run, C = CASES[run.caseId], P = G.player;
    $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === UI.tab ? 'true' : 'false'));
    $$('.pane').forEach(p => p.hidden = p.dataset.pane !== UI.tab);
    // 线索
    const ids = Object.keys(run.clues).filter(id => C.clues[id]).sort((a, b) => run.clues[a].turn - run.clues[b].turn || run.clues[a].at - run.clues[b].at);
    const seen = ids.filter(id => C.clues[id].kind === 'seen');
    const heard = ids.filter(id => C.clues[id].kind === 'heard');
    const item = id => `<div class="clue ${C.clues[id].kind} ${run.clues[id].turn === run.turn ? 'new' : ''}">${esc(C.clues[id].text)}</div>`;
    $('[data-pane=clues]').innerHTML = `
      <h4>看到的</h4>${seen.map(item).join('') || '<div class="empty">还什么都没看到。</div>'}
      <h4>听人说的</h4>${heard.map(item).join('') || '<div class="empty">还没人跟你说什么。</div>'}
      <h4>你的猜测</h4><textarea class="notes" placeholder="自己记。这里写的不算数，只是给你自己看。">${esc(run.notes || '')}</textarea>`;
    const notes = $('.notes');
    notes.oninput = () => { run.notes = notes.value; clearTimeout(UI._nt); UI._nt = setTimeout(() => saveGame(App.G), 400); };
    // 行囊
    const held = Object.keys(run.held).map(id => `<div class="bag-item"><div>${esc(C.objects[id].name)}<small>${esc(typeof C.objects[id].desc === 'string' ? C.objects[id].desc : '')}</small></div></div>`).join('');
    const shop = Object.entries(P.items).filter(([, n]) => n > 0).map(([id, n]) => `<div class="bag-item"><div>${SHOP_BY_ID[id].name}${n > 1 ? ' ×' + n : ''}<small>${SHOP_BY_ID[id].desc}</small></div>${SHOP_BY_ID[id].use && !run.over ? `<button class="btn small" data-use="${id}">用</button>` : ''}</div>`).join('');
    const rope = P.rope > 0 ? `<div class="bag-item"><div>朱砂红绳（系着）<small>还能挡 ${P.rope} 回</small></div></div>` : '';
    $('[data-pane=bag]').innerHTML = `<h4>手里的</h4>${held || '<div class="empty">空着手。</div>'}<h4>兜里的</h4>${shop + rope || '<div class="empty">兜里什么都没有。</div>'}<h4>积分</h4><div class="empty">${P.points}</div>`;
    // 你
    $('[data-pane=me]').innerHTML = `<div class="who-line" style="font-size:1rem">${P.age} 岁，${P.gender}，${esc(P.job)}。${P.call ? '<br><span class="muted">别人叫你：' + esc(P.call) + '</span>' : ''}</div>
      <h4>本事</h4>${P.skills.map(k => `<div class="clue">${SKILLS[k].name}：${SKILLS[k].desc}</div>`).join('')}
      <h4>四项</h4><div class="attrs-mini" style="padding:0;border:0">${Object.entries(ATTRS).map(([k, n]) => `<div><b>${P.attrs[k]}</b>${n}</div>`).join('')}</div>
      <h4>这一局</h4><div class="empty">${G.mode === 'hard' ? '硬核：死了就结束。' : '普通：死了可以从这一夜开头重来。'}</div>`;
  },

  lockOpts() { $$('.opt').forEach(b => b.disabled = true); },

  setBusy(on, text) {
    const b = $('.busy');
    if (!b) return;
    b.classList.toggle('on', !!on);
    if (text) $('.busy-t').textContent = text;
    $$('.opt').forEach(x => x.disabled = !!on);
    const btn = $('.say-form button'); if (btn) btn.disabled = !!on;
    if (on) b.scrollIntoView({ block: 'end', behavior: 'smooth' });
  },

  narrationFailed(msg) {
    $('.fail-slot').innerHTML = `<div class="fail-box">这一段没写出来：${esc(msg)}<br><span class="muted">事情已经算好了，只差把它写出来。</span>
      <div class="row"><button class="btn small primary" data-a="retry">再写一遍</button><button class="btn small" data-a="plain">先用简写看</button></div></div>`;
    $$('.opt').forEach(x => x.disabled = true);
  },

  flashHurt() {
    const f = $('.hurt-flash'); if (!f) return;
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  },

  toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4200);
    $$('.opt').forEach(x => x.disabled = false);
  },

  /* ---------- 一夜结束 ---------- */
  async showNightEnd() {
    const G = App.G, run = G.run, C = CASES[run.caseId], res = run.result || {};
    const root = $('#modal-root');
    if (res.dead) {
      const hard = G.mode === 'hard';
      root.innerHTML = `<div class="overlay"><div class="end-card">
        <span class="seal">死</span>
        <h2>你死在了这一夜</h2>
        <p class="muted" style="line-height:1.9">${hard ? '硬核模式。这一局到这儿就完了，这一夜到底是怎么回事，你不会知道了。' : '普通模式。你可以从这一夜开头重来，积分和四项退回入夜前。'}</p>
        <div class="row">
          ${hard ? '<button class="btn primary" data-e="new">新的一局</button>' : '<button class="btn primary" data-e="restart">从这一夜开头重来</button>'}
          <button class="btn" data-e="close">再看看正文</button>
          <button class="btn" data-e="title">回封面</button>
        </div></div></div>`;
      if (hard) { G.over = true; saveGame(G); }
    } else {
      const ending = C.endings[res.id] || { title: res.title };
      root.innerHTML = `<div class="overlay"><div class="end-card">
        <span class="seal">${C.title.slice(0, 2)}<br>${C.title.slice(2, 4)}</span>
        <h2>${esc(res.title)}</h2>
        <div class="pts">积分 +${res.points}，现在 ${G.player.points}。命回满了。</div>
        <div class="home-text muted">你回去了。</div>
        <div class="truth"><p class="faint">这一夜是怎么回事</p>${paras(C.truth)}</div>
        <div class="row"><button class="btn primary" data-e="home">回家</button><button class="btn" data-e="close">再看看正文</button></div>
      </div></div>`;
      App.homecoming(ending).then(t => { if (t) { G.lastHome = t; saveGame(G); } const h = $('.home-text'); if (h && t) { h.classList.remove('muted'); h.innerHTML = paras(t); } });
    }
    root.onclick = e => {
      const a = e.target.closest('[data-e]')?.dataset.e;
      if (!a) return;
      if (a === 'close') { root.innerHTML = ''; }
      if (a === 'restart') { root.innerHTML = ''; restartNight(G); saveGame(G); UI.lastHp = null; App.enterGame(); }
      if (a === 'new') { root.innerHTML = ''; Store.del(SAVE_KEY); UI.create(); }
      if (a === 'title') { root.innerHTML = ''; UI.title(); }
      if (a === 'home') { root.innerHTML = ''; G.run.homeSeen = true; saveGame(G); UI.home(); }
    };
  },

  home() {
    const G = App.G, P = G.player;
    const nextId = SEASON[G.nightIdx + 1];
    const NC = nextId && CASES[nextId];
    const cn = ['一', '二', '三', '四'];
    const attrRows = Object.entries(ATTRS).map(([k, n]) => {
      const price = pointCardPrice(k, P.attrs[k]);
      return `<div class="bag-item"><div>${n}　<b style="font-weight:400;font-size:1.1rem">${P.attrs[k]}</b><small>加一点要 ${price} 积分</small></div><button class="btn small" data-add="${k}" ${P.points < price ? 'disabled' : ''}>加一点</button></div>`;
    }).join('');
    const own = id => id === 'hongsheng' ? (P.rope > 0 ? `系着，还能挡 ${P.rope} 回` : '') : ((P.items[id] || 0) ? `有 ${P.items[id]} 个` : '');
    const shopRows = SHOP.map(it => `<div class="bag-item"><div>${it.name}　<span class="faint">${it.price}</span><small>${it.desc}${own(it.id) ? '　' + own(it.id) : ''}</small></div><button class="btn small" data-buy="${it.id}" ${P.points < it.price ? 'disabled' : ''}>买</button></div>`).join('');
    $('#app').innerHTML = `<div class="create"><div class="create-inner">
      <h2>回家</h2>
      <div class="home-text">${paras(G.lastHome || '我回到了自己住的地方。屋里的东西都在原处，我挨个看了一遍。')}</div>
      <p class="lede" style="margin-top:1.4em">积分 <b style="color:var(--lamp);font-weight:400">${P.points}</b>。命 ${P.hp}。</p>
      <div class="field" style="margin-top:.6em">加点</div>${attrRows}
      <div class="field" style="margin-top:1.6em">兜里能揣的东西</div>${shopRows}
      <div class="create-row" style="margin-top:2.2em">
        ${NC ? `<button class="btn primary" data-a="night">入夜：第${cn[G.nightIdx + 1]}夜</button>` : `<span class="muted">${nextId ? '下一夜还在做。' : '第一季到这里就完了。'}</span>`}
        <button class="btn" data-a="title">回封面</button>
      </div>
      <p class="tip faint" style="font-size:.8rem;margin-top:1em">什么时候入夜，由你自己定。入夜以后就回不来了，得熬到天亮。</p>
    </div></div>`;
    $('#app').onclick = e => {
      const add = e.target.closest('[data-add]')?.dataset.add;
      const buy = e.target.closest('[data-buy]')?.dataset.buy;
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (add) {
        const price = pointCardPrice(add, P.attrs[add]);
        if (P.points >= price) { P.points -= price; P.attrs[add]++; saveGame(G); UI.home(); }
      }
      if (buy) {
        const it = SHOP_BY_ID[buy];
        if (P.points >= it.price) { P.points -= it.price; if (buy === 'hongsheng') P.rope += 3; else P.items[buy] = (P.items[buy] || 0) + 1; saveGame(G); UI.home(); }
      }
      if (a === 'title') UI.title();
      if (a === 'night' && NC) {
        G.nightIdx++;
        startNight(G);
        saveGame(G);
        UI.lastHp = G.player.hp;
        App.enterGame();
      }
    };
  },

  /* ---------- 设置 ---------- */
  settings() {
    const c = App.cfg;
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal"><div class="modal-box" role="dialog" aria-label="设置">
      <h3>设置</h3>
      <label class="field">接口地址<input id="s-base" value="${esc(c.base)}" placeholder="https://api.deepseek.com"></label>
      <label class="field">模型<input id="s-model" value="${esc(c.model)}" placeholder="deepseek-v4-flash"></label>
      <label class="field">key<input id="s-key" type="password" value="${esc(c.key)}" placeholder="sk-…" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="s-remember" ${c.remember ? 'checked' : ''}>在这台设备上记住 key（不勾的话，关掉页面就忘）</label>
      <label class="check"><input type="checkbox" id="s-offline" ${c.offline ? 'checked' : ''}>离线简写模式：不调模型，正文是干巴巴的简写，输入只认最常见的说法</label>
      <label class="field">字号<input id="s-font" type="range" min="15" max="22" value="${c.font}"></label>
      <div class="row">
        <button class="btn primary" data-s="save">保存</button>
        <button class="btn" data-s="test">试一下连接</button>
        <button class="btn" data-s="close">关掉</button>
      </div>
      <div class="tip" id="s-tip">默认用 DeepSeek。别的 OpenAI 兼容接口也行，填地址和模型名。</div>
      <div class="row">
        <button class="btn small" data-s="export">导出存档</button>
        <button class="btn small" data-s="import">导入存档</button>
        ${location.protocol.startsWith('http') ? '<button class="btn small" data-s="install">装到桌面</button>' : ''}
      </div>
      <div class="tip">存档里有这一局的进度，不带 key。</div>
    </div></div>`;
    const read = () => ({ base: $('#s-base').value.trim() || DEFAULT_CFG.base, model: $('#s-model').value.trim() || DEFAULT_CFG.model, key: $('#s-key').value.trim(), remember: $('#s-remember').checked, offline: $('#s-offline').checked, font: +$('#s-font').value });
    $('#s-font').oninput = e => document.documentElement.style.setProperty('--fs', e.target.value + 'px');
    root.onclick = async e => {
      const a = e.target.closest('[data-s]')?.dataset.s;
      if (e.target.classList.contains('modal')) { root.innerHTML = ''; return; }
      if (!a) return;
      if (a === 'close') { document.documentElement.style.setProperty('--fs', App.cfg.font + 'px'); root.innerHTML = ''; }
      if (a === 'save') { App.cfg = read(); saveCfg(App.cfg); root.innerHTML = ''; App.applyCfg(); }
      if (a === 'test') {
        const tip = $('#s-tip'); const old = App.cfg; App.cfg = Object.assign({}, old, read(), { offline: false });
        tip.textContent = '在连……';
        try { const r = await LLM.chat([{ role: 'user', content: '回一个 JSON：{"ok":true}' }], { maxTokens: 20, temperature: 0 }); tip.textContent = r && r.ok ? '连上了。' : '连上了，但回话有点怪。'; }
        catch (err) { tip.textContent = '没连上：' + err.message; }
        App.cfg = old;
      }
      if (a === 'install') { root.innerHTML = ''; Install.offer(true); }
      if (a === 'export') { if (App.G) downloadText(`夜不收存档-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(App.G)); else $('#s-tip').textContent = '还没有存档。'; }
      if (a === 'import') {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = async () => {
          try {
            const G = JSON.parse(await inp.files[0].text());
            if (!G || G.v !== 1 || !G.player) throw new Error('不是这个游戏的存档');
            App.G = G; saveGame(G); root.innerHTML = ''; App.enterGame();
          } catch (err) { $('#s-tip').textContent = '导入失败：' + err.message; }
        };
        inp.click();
      }
    };
  },
};

/* ---- 90-main.js ---- */
'use strict';

const App = {
  G: null,
  cfg: loadCfg(),

  applyCfg() {
    document.documentElement.style.setProperty('--fs', (App.cfg.font || 18) + 'px');
  },

  enterGame() {
    const G = App.G;
    if (!G) return UI.title();
    if (G.over) { UI.title(); return; }
    if (!G.run) { UI.home(); return; }
    if (G.run.over && G.run.result && !G.run.result.dead && G.run.homeSeen) { UI.home(); return; }
    UI.lastHp = G.player.hp;
    $('#app').innerHTML = '';
    UI.renderNight(false);
  },

  async homecoming(ending) {
    const G = App.G;
    if (App.cfg.offline || !App.cfg.key) return ending.echo ? `那天早上我醒得很早。刷牙的时候，我盯着镜子看了很久，镜子里那个人也看着我，看得比我久一点。` : '';
    try {
      const r = await LLM.chat(Prompts.homecoming(G, ending), { json: false, temperature: 0.9, maxTokens: 800, tag: 'home' });
      const t = typeof r === 'string' ? r : (r && r.text) || '';
      return t.trim().replace(/^["“「]|["”」]$/g, '');
    } catch (e) { return ''; }
  },
};

window.addEventListener('DOMContentLoaded', () => {
  App.applyCfg();
  UI.title();
});

/* ---- 95-install.js ---- */
'use strict';

/* 装到桌面 + 离线。Chrome/Edge 一点就装；Safari 只能给指引；file:// 下什么都不做。 */
const Install = {
  KEY: 'yebushou.install',
  deferred: null,
  armed: false,
  ua: navigator.userAgent,
  get isSafari() { return /Safari/.test(this.ua) && !/Chrome|Chromium|Edg|OPR|CriOS|FxiOS/.test(this.ua); },
  get isIOS() { return /iPhone|iPad|iPod/.test(this.ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  get standalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  get canPrompt() { return !!this.deferred; },
  get available() { return location.protocol.startsWith('http') && !this.standalone && (this.canPrompt || this.isSafari); },

  init() {
    if (!location.protocol.startsWith('http')) return;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); this.deferred = e; this.arm(); });
    addEventListener('appinstalled', () => { this.deferred = null; try { localStorage.setItem(this.KEY, 'installed'); } catch (_) {} this.close(); });
    if (this.isSafari) addEventListener('load', () => this.arm());
    this.sw();
  },

  arm() {
    if (this.armed || this.standalone) return;
    let st = null; try { st = localStorage.getItem(this.KEY); } catch (_) {}
    if (st === 'dismissed' || st === 'installed') return;
    this.armed = true;
    const t = setInterval(() => {
      if (document.querySelector('.night')) { clearInterval(t); setTimeout(() => this.offer(false), 45000); }
    }, 2000);
  },

  offer(manual) {
    if (document.querySelector('.install-offer')) return;
    if (!manual && this.standalone) return;
    const box = document.createElement('div');
    box.className = 'install-offer';
    box.setAttribute('role', 'dialog');
    let body;
    if (this.standalone) body = '<h4>已经装好了</h4><p>你现在就是从桌面图标打开的。</p>';
    else if (this.canPrompt) body = '<h4>把夜不收装到桌面</h4><p>装了以后有自己的图标和窗口，断网也能接着玩。</p>';
    else if (this.isIOS) body = '<h4>添加到主屏幕</h4><ol><li>点底部工具栏的<b>分享</b>按钮</li><li>往下找<b>「添加到主屏幕」</b></li><li>右上角点<b>添加</b></li></ol>';
    else if (this.isSafari) body = '<h4>添加到程序坞</h4><ol><li>菜单栏<b>文件</b></li><li>点<b>「添加到程序坞」</b></li></ol>';
    else body = '<h4>装到桌面</h4><p>这个浏览器不支持一键安装。用 Chrome 或 Edge 打开这个网址，地址栏右边会有「安装」按钮。</p>';
    box.innerHTML = body + `<div class="row">${this.canPrompt && !this.standalone ? '<button class="btn primary" data-i="go">装</button>' : ''}<button class="btn" data-i="later">${manual ? '关掉' : '以后再说'}</button></div>`;
    box.onclick = async e => {
      const a = e.target.closest('[data-i]')?.dataset.i;
      if (a === 'go') await this.doInstall();
      if (a === 'later') { if (!manual) { try { localStorage.setItem(this.KEY, 'dismissed'); } catch (_) {} } this.close(); }
    };
    document.body.appendChild(box);
  },
  close() { const b = document.querySelector('.install-offer'); if (b) b.remove(); },

  async doInstall() {
    if (!this.deferred) return;
    this.deferred.prompt();
    const { outcome } = await this.deferred.userChoice;
    this.deferred = null;
    try { localStorage.setItem(this.KEY, outcome === 'accepted' ? 'installed' : 'dismissed'); } catch (_) {}
    this.close();
  },

  sw() {
    if (!('serviceWorker' in navigator)) return;
    let reloading = false;
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) this.updateBar(reg);
        });
      });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
  },
  updateBar(reg) {
    if (document.querySelector('.update-bar')) return;
    const b = document.createElement('div');
    b.className = 'update-bar';
    b.innerHTML = '<span>有新版本</span><button class="btn small" data-u="go">刷新</button><button class="btn small" data-u="x">先不</button>';
    b.onclick = e => {
      const a = e.target.closest('[data-u]')?.dataset.u;
      if (a === 'go' && reg.waiting) reg.waiting.postMessage('skipWaiting');
      if (a) b.remove();
    };
    document.body.appendChild(b);
  },
};
Install.init();

</script>
