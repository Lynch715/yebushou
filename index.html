<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#0e0c0a">
<title>夜不收</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="夜不收">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* 夜里是灯下的纸。命灯的光照着正文，命越少，光越暗。 */
:root {
  --soot: #1a1511;       /* 烟熏过的墙 */
  --soot-2: #231c16;
  --soot-3: #2e251d;
  --paper: #d9ccb2;      /* 灯下的旧纸 */
  --paper-dim: #a3967f;
  --paper-faint: #6f6455;
  --cinnabar: #a3382a;   /* 朱砂 */
  --cinnabar-hi: #c6523f;
  --lamp: #e3a948;       /* 豆油灯 */
  --line: rgba(217, 204, 178, .14);
  --glow: 1;             /* 命灯亮度 0..1，由脚本写 */
  --fs: 18px;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", serif;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--soot);
  color: var(--paper);
  font-family: var(--serif);
  font-size: var(--fs);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::before { /* 纸纹 */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .18; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .7  0 0 0 0 .55  0 0 0 .9 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}
#app { position: relative; z-index: 1; height: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
a { color: var(--lamp); }

.btn {
  background: transparent; border: 1px solid var(--line); color: var(--paper);
  padding: .55em 1.1em; border-radius: 2px; font-size: .9rem; letter-spacing: .05em;
  transition: border-color .2s, background .2s;
}
.btn:hover { border-color: var(--paper-dim); background: rgba(217,204,178,.04); }
.btn.primary { border-color: var(--cinnabar); color: var(--paper); background: rgba(163,56,42,.18); }
.btn.primary:hover { background: rgba(163,56,42,.32); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.small { font-size: .8rem; padding: .35em .8em; }
.muted { color: var(--paper-dim); }
.faint { color: var(--paper-faint); }

/* ---------- 封面 ---------- */
.title-screen {
  height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6vh 4vw;
  background: radial-gradient(ellipse 40% 55% at 50% 42%, rgba(227,169,72,.13), transparent 70%);
}
.title-screen .vert {
  grid-column: 2; writing-mode: vertical-rl; font-size: clamp(2.6rem, 7vh, 4.4rem); letter-spacing: .32em;
  line-height: 1.3; color: var(--paper); font-weight: 600; margin: 0 auto; text-shadow: 0 0 30px rgba(227,169,72,.18);
}
.title-screen .vert small { font-size: .32em; letter-spacing: .5em; color: var(--paper-dim); margin-top: 1.4em; font-weight: 400; }
.seal {
  display: inline-grid; place-items: center; width: 2.6em; height: 2.6em; border: 2px solid var(--cinnabar); color: var(--cinnabar-hi);
  font-size: .9rem; line-height: 1.05; text-align: center; border-radius: 3px; padding: .2em; font-family: var(--kai);
  writing-mode: vertical-rl; white-space: nowrap; letter-spacing: 0; flex: none;
}
.title-menu { grid-column: 3; display: flex; flex-direction: column; gap: .8rem; align-items: flex-start; padding-left: 3vw; }
.title-menu .btn { min-width: 9em; text-align: left; }
.title-foot { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font-size: .75rem; color: var(--paper-faint); }

/* ---------- 建人物 ---------- */
.create {
  height: 100%; overflow: auto; padding: 5vh 1rem 8vh;
  background: radial-gradient(ellipse 50% 40% at 50% 0%, rgba(227,169,72,.09), transparent 70%);
}
.create-inner { max-width: 34rem; margin: 0 auto; }
.create h2 { font-weight: 600; font-size: 1.5rem; letter-spacing: .1em; margin: 0 0 .3em; }
.create .lede { color: var(--paper-dim); font-size: .95rem; line-height: 1.8; margin: 0 0 2em; }
.who-card { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 1.4em 0; }
.who-line { font-size: 1.25rem; line-height: 1.9; }
.who-line b { font-weight: 600; color: var(--paper); }
.who-skills { margin-top: .6em; font-size: .92rem; color: var(--paper-dim); line-height: 1.8; }
.who-skills span { color: var(--lamp); }
.attr-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; margin-top: 1.2em; }
.attr { text-align: center; }
.attr .n { font-size: 1.7rem; display: block; line-height: 1.2; }
.attr .k { font-size: .8rem; color: var(--paper-dim); letter-spacing: .2em; }
.create-row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1.4em; }
.field { display: flex; flex-direction: column; gap: .35em; margin-top: 1.4em; font-size: .9rem; color: var(--paper-dim); }
.field input, .field select {
  background: var(--soot-2); border: 1px solid var(--line); padding: .55em .7em; border-radius: 2px; color: var(--paper); font-size: 1rem;
}
.mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .4em; }
.mode-pick label { border: 1px solid var(--line); padding: .8em .9em; border-radius: 2px; cursor: pointer; line-height: 1.6; color: var(--paper); }
.mode-pick label small { display: block; color: var(--paper-dim); font-size: .8rem; }
.mode-pick input { position: absolute; opacity: 0; pointer-events: none; }
.mode-pick label:has(input:checked) { border-color: var(--cinnabar); background: rgba(163,56,42,.12); }
.mode-pick label:has(input:focus-visible) { outline: 2px solid var(--lamp); }

/* ---------- 夜 ---------- */
.night {
  height: 100%; display: grid;
  grid-template-columns: 17rem minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "side story" "side act";
}
.night .side {
  grid-area: side; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  background: linear-gradient(180deg, var(--soot-2), var(--soot));
}
.night .story {
  grid-area: story; overflow-y: auto; min-height: 0; position: relative; scroll-behavior: smooth;
  background:
    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(227,169,72, calc(.11 * var(--glow))), transparent 75%),
    radial-gradient(ellipse 80% 70% at 50% 40%, transparent 40%, rgba(0,0,0, calc(.55 - .35 * var(--glow))) 100%);
  transition: background 1.2s;
}
.night .act { grid-area: act; border-top: 1px solid var(--line); background: var(--soot); padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom)); }
.act-inner, .story-inner { max-width: 36rem; margin: 0 auto; }
.story-inner { padding: 2.2rem 1.2rem 3rem; }

/* 侧栏：时辰、命灯 */
.dial-wrap { display: flex; align-items: center; gap: .9rem; padding: 1.1rem 1.1rem .8rem; }
.dial { width: 74px; height: 74px; flex: none; }
.dial text { font-family: var(--serif); fill: var(--paper-faint); font-size: 10px; }
.dial text.now { fill: var(--lamp); }
.dial .hand { stroke: var(--cinnabar-hi); stroke-width: 1.6; stroke-linecap: round; }
.time-big { font-size: 1.25rem; letter-spacing: .08em; }
.time-small { font-size: .78rem; color: var(--paper-faint); margin-top: .1em; }
.lampbar { padding: .2rem 1.1rem 1rem; display: flex; align-items: center; gap: .7rem; border-bottom: 1px solid var(--line); }
.lampbar svg { flex: none; }
.lampbar .flame { transform-origin: 12px 14px; transition: transform .8s, opacity .8s; }
.lampbar .meter { flex: 1; height: 3px; background: rgba(217,204,178,.1); position: relative; }
.lampbar .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lamp); transition: width .8s; }
.lampbar .meter i.low { background: var(--cinnabar-hi); }
.lampbar .hpn { font-size: .85rem; color: var(--paper-dim); min-width: 2.2em; text-align: right; }
.attrs-mini { display: grid; grid-template-columns: repeat(4, 1fr); padding: .7rem 1.1rem; border-bottom: 1px solid var(--line); font-size: .78rem; color: var(--paper-dim); text-align: center; }
.attrs-mini b { display: block; color: var(--paper); font-size: 1rem; font-weight: 400; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: .7em 0; color: var(--paper-faint); font-size: .88rem; letter-spacing: .15em; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--cinnabar); }
.panes { flex: 1; overflow-y: auto; min-height: 0; padding: .9rem 1.1rem 1.4rem; }
.pane[hidden] { display: none; }
.pane h4 { font-size: .78rem; color: var(--paper-faint); font-weight: 400; letter-spacing: .2em; margin: 1.1em 0 .5em; }
.pane h4:first-child { margin-top: 0; }
.clue { font-size: .86rem; line-height: 1.7; padding: .45em 0 .45em .7em; border-left: 2px solid var(--soot-3); margin-bottom: .35em; color: var(--paper); }
.clue.new { border-left-color: var(--lamp); }
.clue.heard { font-family: var(--kai); }
.empty { font-size: .82rem; color: var(--paper-faint); line-height: 1.7; }
.notes { width: 100%; min-height: 8em; resize: vertical; background: var(--soot-2); border: 1px solid var(--line); border-radius: 2px; padding: .6em; font-size: .86rem; line-height: 1.7; color: var(--paper); }
.bag-item { display: flex; justify-content: space-between; align-items: center; gap: .6em; padding: .5em 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.bag-item small { display: block; color: var(--paper-faint); font-size: .76rem; line-height: 1.5; }
.side-foot { padding: .7rem 1.1rem; border-top: 1px solid var(--line); display: flex; gap: .5rem; }

/* 正文 */
.case-head { margin-bottom: 2.2rem; display: flex; gap: 1rem; align-items: center; }
.case-head .t { font-size: 1.5rem; letter-spacing: .14em; font-weight: 600; }
.case-head .meta { font-size: .82rem; color: var(--paper-dim); line-height: 1.8; margin-top: .2em; }
.brief { border: 1px solid var(--line); padding: .9em 1.1em; font-size: .9rem; line-height: 1.85; color: var(--paper-dim); margin-bottom: 2.2rem; }
.brief b { color: var(--paper); font-weight: 400; }
.chapter { margin-bottom: 2.4rem; }
.chapter p { margin: 0 0 1em; line-height: 2.05; text-align: justify; letter-spacing: .02em; }
.chapter .you-said { font-size: .86rem; color: var(--cinnabar-hi); margin-bottom: 1.1em; padding-left: .8em; border-left: 2px solid var(--cinnabar); font-family: var(--kai); line-height: 1.7; }
.chapter.fresh { animation: inkin 1.1s ease both; }
@keyframes inkin { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
.chapter .hurt-mark { display: inline-block; width: .5em; height: .5em; background: var(--cinnabar); border-radius: 50%; margin-left: .3em; vertical-align: middle; }

.busy { display: none; color: var(--paper-faint); font-size: .9rem; padding: 0 0 2rem; }
.busy.on { display: block; }
.busy .dot { display: inline-block; width: .35em; height: .35em; background: var(--paper-dim); border-radius: 50%; margin-right: .5em; animation: drip 1.4s infinite ease-in; vertical-align: middle; }
@keyframes drip { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }

.fail-box { border: 1px solid var(--cinnabar); padding: 1em; margin-bottom: 2rem; font-size: .9rem; line-height: 1.8; }
.fail-box .row { display: flex; gap: .6rem; margin-top: .7em; flex-wrap: wrap; }

/* 选项和输入 */
.end-gate { display: flex; justify-content: center; padding: .6rem 0 .2rem; }
.end-gate .btn { min-width: 10em; }
.opts { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .7rem; }
.opt {
  text-align: left; background: transparent; border: 0; border-left: 2px solid var(--soot-3);
  padding: .35em .8em; color: var(--paper); font-size: .95rem; line-height: 1.6; transition: border-color .15s, background .15s;
}
.opt:hover, .opt:focus-visible { border-left-color: var(--lamp); background: rgba(227,169,72,.05); }
.opt[disabled] { opacity: .45; }
.say-form { display: flex; gap: .6rem; align-items: flex-end; }
.say-form textarea {
  flex: 1; resize: none; min-height: 2.6em; max-height: 8em; background: var(--soot-2); border: 1px solid var(--line); border-radius: 2px;
  padding: .55em .75em; font-size: .98rem; line-height: 1.6; color: var(--paper);
}
.say-form textarea::placeholder { color: var(--paper-faint); }

/* 受伤：屏幕边上一下红 */
.hurt-flash { position: fixed; inset: 0; pointer-events: none; z-index: 50; box-shadow: inset 0 0 160px rgba(163,56,42,.55); opacity: 0; }
.hurt-flash.on { animation: hurt 1.4s ease-out; }
@keyframes hurt { 0% { opacity: 1; } 100% { opacity: 0; } }

/* 移动端顶栏与标签 */
.topbar { display: none; }
.tabbar { display: none; }

/* ---------- 结算 ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(20,16,13,.97); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 1rem; overflow: auto; }
.end-card { max-width: 32rem; width: 100%; padding: 2.4rem 1.6rem; text-align: left; }
.end-card .seal { font-size: 1.1rem; width: 3em; height: 3em; margin-bottom: 1.2rem; }
.end-card h2 { font-size: 1.9rem; letter-spacing: .2em; font-weight: 600; margin: 0 0 .4em; }
.end-card .pts { color: var(--lamp); font-size: 1rem; margin-bottom: 1.6em; }
.end-card .truth { border-top: 1px solid var(--line); padding-top: 1.2em; margin-top: 1.4em; font-size: .95rem; line-height: 2; color: var(--paper-dim); }
.end-card .truth p { margin: 0 0 .9em; }
.end-card .row { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 1.8em; }
.home-text { font-size: .98rem; line-height: 2; margin: 1.2em 0 0; color: var(--paper); }

/* ---------- 设置弹窗 ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(10,8,6,.8); display: grid; place-items: center; padding: 1rem; }
.modal-box { background: var(--soot-2); border: 1px solid var(--line); width: 100%; max-width: 28rem; max-height: 90vh; overflow: auto; padding: 1.4rem 1.4rem 1.2rem; border-radius: 3px; }
.modal-box h3 { margin: 0 0 .4em; font-weight: 600; letter-spacing: .1em; }
.modal-box .field { margin-top: 1em; }
.modal-box .check { display: flex; gap: .5em; align-items: center; margin-top: .8em; font-size: .88rem; color: var(--paper-dim); }
.modal-box .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.3em; }
.modal-box .tip { font-size: .8rem; color: var(--paper-faint); line-height: 1.7; margin-top: .6em; }

.toast { position: fixed; left: 50%; bottom: 7rem; transform: translateX(-50%); background: var(--soot-3); border: 1px solid var(--cinnabar); padding: .6em 1em; font-size: .88rem; z-index: 80; max-width: 90vw; line-height: 1.6; }

/* ---------- 手机 ---------- */
@media (max-width: 820px) {
  :root { --fs: 17px; }
  .night { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "top" "story" "act" "tabs"; }
  .night .side { grid-area: story; border-right: 0; z-index: 3; }
  .night .side.mobile-hidden { display: none; }
  .night .side .dial-wrap, .night .side .lampbar, .night .side .attrs-mini { display: none; }
  .night .side .tabs { display: none; }
  .topbar { grid-area: top; display: flex; align-items: center; gap: .7rem; padding: calc(.5rem + env(safe-area-inset-top)) 1rem .5rem; border-bottom: 1px solid var(--line); background: var(--soot); }
  .topbar .dial { width: 38px; height: 38px; }
  .topbar .dial text { display: none; }
  .topbar .tt { flex: 1; min-width: 0; }
  .topbar .tt div:first-child { font-size: 1rem; }
  .topbar .tt div:last-child { font-size: .72rem; color: var(--paper-faint); }
  .topbar .mini-hp { width: 5.5rem; display: flex; align-items: center; gap: .4rem; }
  .topbar .mini-hp .meter { flex: 1; height: 3px; background: rgba(217,204,178,.1); position: relative; }
  .topbar .mini-hp .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lamp); }
  .topbar .mini-hp .meter i.low { background: var(--cinnabar-hi); }
  .topbar .icon-btn { background: none; border: 0; padding: .3rem; color: var(--paper-dim); }
  .story-inner { padding: 1.4rem 1.1rem 2rem; }
  .night .act { padding: .6rem .8rem .6rem; }
  .night .act.mobile-hidden { display: none; }
  .tabbar { grid-area: tabs; display: flex; border-top: 1px solid var(--line); background: var(--soot); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; background: none; border: 0; padding: .65em 0 .7em; color: var(--paper-faint); font-size: .85rem; letter-spacing: .2em; }
  .tabbar button[aria-selected="true"] { color: var(--paper); box-shadow: inset 0 2px 0 var(--cinnabar); }
  .side-foot { display: none; }
  .title-screen { grid-template-columns: 1fr; grid-template-rows: 1fr auto; justify-items: center; }
  .title-screen .vert { grid-column: 1; }
  .title-menu { grid-column: 1; padding: 0 0 4vh; align-items: stretch; }
  .opt { font-size: .92rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- 装到桌面 ---------- */
.install-offer {
  position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(92vw, 30em); background: var(--soot-2); border: 1px solid var(--line); border-radius: 3px;
  padding: 1em 1.1em; z-index: 60; box-shadow: 0 10px 40px rgba(0,0,0,.6); font-size: .92rem; line-height: 1.7;
}
.install-offer h4 { margin: 0 0 .3em; font-weight: 600; color: var(--paper); font-size: 1rem; }
.install-offer p { margin: 0 0 .8em; color: var(--paper-dim); }
.install-offer ol { margin: 0 0 .8em 1.2em; padding: 0; color: var(--paper-dim); }
.install-offer b { color: var(--paper); font-weight: 600; }
.install-offer .row { display: flex; gap: .6em; flex-wrap: wrap; }
.update-bar {
  position: fixed; top: calc(.6rem + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  background: var(--soot-3); border: 1px solid var(--line); border-radius: 3px; padding: .5em .9em; z-index: 60;
  font-size: .85rem; color: var(--paper-dim); display: flex; gap: .8em; align-items: center;
}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---- 00-util.js ---- */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function pick(arr, r) { return arr[Math.floor(r * arr.length)]; }

/* 可存档的随机数：状态就是一个整数 */
function rngNext(st) {
  st.seed = (st.seed + 0x6D2B79F5) | 0;
  let t = st.seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function freshSeed() { return (Math.random() * 2 ** 31) | 0; }

/* ---------- 时辰 ----------
   时间一律是"从案件开局那天零点起的分钟数"，可以超过 1440。 */
const SHICHEN = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const CN_NUM = ['', '一', '二', '三', '四', '五', '六', '七'];

function hhmm(min) {
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function shichenOf(min) {
  const m = (((min + 60) % 1440) + 1440) % 1440;
  const idx = Math.floor(m / 120);
  const into = m % 120;
  const half = into < 60 ? '初' : '正';
  const ke = Math.floor((into % 60) / 15);
  return SHICHEN[idx] + half + (ke ? CN_NUM[ke] + '刻' : '');
}
function shichenName(min) {
  const m = (((min + 60) % 1440) + 1440) % 1440;
  return SHICHEN[Math.floor(m / 120)] + '时';
}
function parseHHMM(s, nowMin) {
  const mt = /^(\d{1,2})[:：](\d{2})$/.exec(String(s).trim());
  if (!mt) return null;
  let t = +mt[1] * 60 + +mt[2];
  const day = Math.floor(nowMin / 1440) * 1440;
  t += day;
  while (t <= nowMin) t += 1440;
  return t;
}

/* 存储都包 try，隐私模式下会抛 */
const Store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  sget(k, d = null) { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  sset(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function downloadText(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* 从模型回复里抠出第一个完整 JSON 对象 */
/* 字符串里的裸换行、制表符转义掉；中文弯引号当成普通字 */
function repairJSON(s) {
  let out = '', inStr = false, escp = false;
  for (const c of s) {
    if (inStr) {
      if (escp) { escp = false; out += c; continue; }
      if (c === '\\') { escp = true; out += c; continue; }
      if (c === '"') { inStr = false; out += c; continue; }
      if (c === '\n') { out += '\\n'; continue; }
      if (c === '\r') continue;
      if (c === '\t') { out += ' '; continue; }
      out += c;
    } else {
      if (c === '"') inStr = true;
      out += c;
    }
  }
  return out.replace(/,\s*([}\]])/g, '$1');
}
function parseLoose(s) {
  try { return JSON.parse(s); } catch (e) {}
  try { return JSON.parse(repairJSON(s)); } catch (e) {}
  return null;
}
function extractJSON(text, open = '{') {
  if (!text) return null;
  let s = String(text).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const direct = parseLoose(s);
  if (direct != null) return direct;
  const close = open === '{' ? '}' : ']';
  const i = s.indexOf(open);
  if (i < 0) return null;
  let depth = 0, inStr = false, escp = false;
  for (let j = i; j < s.length; j++) {
    const c = s[j];
    if (inStr) {
      if (escp) escp = false;
      else if (c === '\\') escp = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') inStr = true;
    else if (c === open) depth++;
    else if (c === close) { depth--; if (depth === 0) return parseLoose(s.slice(i, j + 1)); }
  }
  return null;
}

/* ---------- 案件加载 ---------- */
const CASES = {};
function registerCase(def) { CASES[def.id] = def; }
(function loadCases() {
  const K = new TextEncoder().encode('yebuguiren-2026');
  for (const id of Object.keys(typeof CASE_BLOBS === 'object' ? CASE_BLOBS : {})) {
    try {
      const bin = atob(CASE_BLOBS[id]);
      const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ K[i % K.length];
      const src = new TextDecoder().decode(u);
      new Function('registerCase', src)(registerCase);
    } catch (e) { console.error('案件加载失败', id, e); }
  }
})();

/* ---------- 人物 ---------- */
function rollCharacter(lock = {}, prev = null) {
  const r = () => Math.random();
  const p = clone(prev) || {};
  if (!lock.gender) p.gender = r() < 0.5 ? '男' : '女';
  if (!lock.ident) p.ident = pick(Object.keys(IDENTITIES), r());
  const idef = IDENTITIES[p.ident];
  if (!lock.ident || !p.job) {
    const [job, sk] = pick(idef.jobs, r());
    p.job = job;
    p.skills = [sk];
    if (r() < 0.3) {
      const extra = pick(Object.keys(SKILLS).filter(k => k !== sk), r());
      p.skills.push(extra);
    }
  }
  if (!lock.age) p.age = idef.age[0] + Math.floor(r() * (idef.age[1] - idef.age[0] + 1));
  if (!lock.attrs) p.attrs = { zhi: rInt(0, 10), gong: rInt(0, 10), min: rInt(0, 10), yun: rInt(0, 10) };
  p.call = p.call || '';
  return p;
  function rInt(a, b) { return a + Math.floor(r() * (b - a + 1)); }
}

function newGame(ch, mode) {
  return {
    v: 1,
    id: 'g' + Date.now().toString(36),
    mode,
    player: {
      gender: ch.gender, age: ch.age, ident: ch.ident, job: ch.job, skills: ch.skills.slice(), call: (ch.call || '').trim(),
      attrs: clone(ch.attrs), hp: 100, points: 0, items: {}, rope: 0,
    },
    nightIdx: 0,
    cleared: {},
    run: null,
    rng: { seed: freshSeed() },
    snap: null,
    created: Date.now(),
  };
}

function startNight(G, forced) {
  const cid = forced || SEASON[G.nightIdx];
  const C = CASES[cid];
  if (!C) throw new Error('没有这个案件：' + cid);
  G.snap = clone({ player: G.player, rng: G.rng });
  G.run = {
    caseId: cid,
    min: C.start,
    loc: C.startLoc,
    s: C.init(),
    clues: {},
    notes: '',
    held: {},
    chapters: [{ turn: 0, input: '', text: C.opening, clock: C.start }],
    options: C.openingOptions.map(o => clone(o)),
    pending: null,
    turn: 0,
    over: null,
    fired: {},
    deaths: 0,
  };
  (C.initRun || (() => {}))(G.run);
  return G.run;
}

function restartNight(G) {
  if (!G.snap) return;
  const same = G.run && G.run.caseId;
  G.player = clone(G.snap.player);
  G.rng = clone(G.snap.rng);
  G.rng.seed = (G.rng.seed + 7919) | 0;
  startNight(G, same);
}

/* ---- 30-engine.js ---- */
'use strict';

/* 引擎：确定性结算。模型只给动作单，这里决定发生了什么。 */
const Engine = (() => {
  /* 每个动作花的时间。一夜大约七个钟头、三十来回合，平均一回合十几分钟。 */
  const COST = { look: 15, examine: 10, move: 5, take: 2, drop: 1, give: 5, show: 5, say: 5, write: 10, use: 5, open: 5, force: 10, stop: 2, hide: 5, wait: 0, recall: 0, other: 10 };
  const MIN_TURN = 12; // 一回合就是正文里的一段，至少过这么久

  function caseOf(G) { return CASES[G.run.caseId]; }

  /* ---------- 可见范围 ---------- */
  function objVisible(G, id) {
    const C = caseOf(G), run = G.run, o = C.objects[id];
    if (!o) return false;
    if (run.held[id]) return true;
    const moved = run.s.__loc && run.s.__loc[id];
    const loc = moved || (typeof o.loc === 'function' ? o.loc(run.s, run) : o.loc);
    if (loc !== run.loc) return false;
    if (o.hidden && o.hidden(run.s, run)) return false;
    return true;
  }
  function npcWhere(G, id) {
    const C = caseOf(G), n = C.npcs[id];
    if (!n) return null;
    return typeof n.where === 'function' ? n.where(G.run.s, G.run) : n.where;
  }
  function npcPresent(G, id) {
    const w = npcWhere(G, id);
    if (!w) return false;
    if (w === G.run.loc) return true;
    const n = caseOf(G).npcs[id];
    return !!(n.hearFrom && n.hearFrom(G.run.s, G.run).includes(G.run.loc));
  }

  function glossary(G) {
    const C = caseOf(G), run = G.run, s = run.s;
    const here = C.locations[run.loc];
    const exits = (typeof here.exits === 'function' ? here.exits(s, run) : here.exits) || [];
    const objs = Object.keys(C.objects).filter(id => objVisible(G, id));
    const npcs = Object.keys(C.npcs).filter(id => npcPresent(G, id));
    const flags = (C.flags || []).filter(f => !f.when || f.when(s, run));
    const items = Object.entries(G.player.items).filter(([, n]) => n > 0).map(([id]) => id);
    return { here: run.loc, hereName: here.name, exits, objs, npcs, flags, items, pending: run.pending };
  }

  function glossaryText(G) {
    const C = caseOf(G), g = glossary(G);
    const L = [];
    L.push(`你现在在：${g.here}（${g.hereName}）`);
    L.push('能去的地方：' + (g.exits.map(id => `${id}（${C.locations[id].name}）`).join('、') || '无'));
    L.push('这里看得见、摸得着的东西：' + (g.objs.map(id => {
      const o = C.objects[id];
      return `${id}（${o.name}${o.alias ? '，也叫' + o.alias.join('/') : ''}${G.run.held[id] ? '，在你手里' : ''}）`;
    }).join('、') || '无'));
    L.push('在场或听得见的人：' + (g.npcs.map(id => `${id}（${C.npcs[id].name}）`).join('、') || '无'));
    if (g.items.length) L.push('你兜里的东西（商城买的）：' + g.items.map(id => `${id}（${SHOP_BY_ID[id].name}）`).join('、'));
    if (g.pending) L.push('此刻的情况：' + g.pending.desc);
    return { text: L.join('\n'), g };
  }

  /* ---------- 动作单清洗 ---------- */
  function sanitize(G, steps) {
    const C = caseOf(G);
    if (!Array.isArray(steps)) return [];
    const out = [];
    for (const raw of steps.slice(0, 6)) {
      if (!raw || typeof raw !== 'object') continue;
      const st = { type: String(raw.type || 'other') };
      if (!ACTION_TYPES[st.type]) st.type = 'other';
      for (const k of ['target', 'item', 'to', 'text', 'topic', 'until', 'how']) if (raw[k] != null) st[k] = String(raw[k]).slice(0, 300);
      if (raw.minutes != null) st.minutes = clamp(parseInt(raw.minutes, 10) || 0, 0, 480);
      st.flags = {};
      if (raw.flags && typeof raw.flags === 'object') for (const [k, v] of Object.entries(raw.flags)) st.flags[k] = v === true || v === 'true';
      if (st.type === 'move' && st.target && !C.locations[st.target]) { st.text = st.text || st.target; st.target = null; }
      out.push(st);
    }
    return out;
  }

  /* ---------- 一回合 ---------- */
  function exec(G, steps, inputText) {
    const run = G.run, C = caseOf(G), P = G.player;
    run.turn++;
    const R = {
      input: inputText || '', steps: [], lines: [], must: [], notes: [], clues: [], rolls: [],
      dmg: 0, hpBefore: P.hp, interrupted: null, ending: null, dead: false, revived: false,
      timeFrom: run.min, timeTo: run.min, pendingBefore: run.pending,
    };
    const ctx = makeCtx(G, R);
    const pendingAtStart = run.pending;

    for (let i = 0; i < steps.length; i++) {
      const st = steps[i];
      const rec = { step: st, idx: i };
      R.steps.push(rec);
      ctx.cost = COST[st.type] ?? 5;
      let handled = false;
      try {
        handled = C.act ? C.act(ctx, st) === true : false;
        if (!handled) generic(ctx, st);
      } catch (e) { console.error(e); ctx.fact('（这一步没做成。）'); }
      if (R.dead || R.ending) break;
      if (st.type === 'wait') waitFor(ctx, st);
      else advance(ctx, ctx.cost);
      if (C.check) C.check(ctx);
      if (R.dead || R.ending || R.interrupted) {
        if (R.interrupted && i < steps.length - 1) R.cancelled = steps.slice(i + 1);
        break;
      }
    }
    // 一回合至少过 MIN_TURN 分钟（被事件打断、结局、只是回想的除外）
    const spent = run.min - R.timeFrom;
    const onlyRecall = steps.every(st => st.type === 'recall');
    if (!R.dead && !R.ending && !R.interrupted && !onlyRecall && spent < (C.minTurn || MIN_TURN)) {
      advance(ctx, (C.minTurn || MIN_TURN) - spent);
      if (C.check && !R.dead && !R.ending) C.check(ctx);
    }
    // 回合开始时的叫声，玩家这回合不搭理就过去了
    if (pendingAtStart && run.pending === pendingAtStart && !pendingAtStart.sticky) run.pending = null;
    R.timeTo = run.min;
    R.hpAfter = P.hp;
    R.scene = scene(G);
    return R;
  }

  function makeCtx(G, R) {
    const run = G.run, C = caseOf(G), P = G.player;
    const ctx = {
      G, run, C, P, R, cost: 0,
      get s() { return run.s; },
      get now() { return run.min; },
      get loc() { return run.loc; },
      fact(text, kind = 'see') { if (text) R.lines.push({ kind, text }); },
      must(text) { if (text) R.must.push(text); },
      say(npc, text) { const n = C.npcs[npc]; R.must.push(`${n ? n.name : npc}说：「${text}」`); },
      note(text) { if (text) R.notes.push(text); },
      clue(id) {
        if (!C.clues[id] || run.clues[id]) return false;
        run.clues[id] = { turn: run.turn, at: run.min };
        R.clues.push(id);
        return true;
      },
      hasClue(id) { return !!run.clues[id]; },
      skill(id) { return P.skills.includes(id); },
      held(id) { return !!run.held[id]; },
      hold(id) { run.held[id] = true; },
      unhold(id) { delete run.held[id]; },
      visible(id) { return objVisible(G, id); },
      present(id) { return npcPresent(G, id); },
      attr(a) { return P.attrs[a] || 0; },
      roll(attr, diff, label = '') {
        let p = DIFF[diff] + (P.attrs[attr] || 0) * 5;
        if (attr === 'min' && P.skills.includes('quick')) p += 10;
        if (attr === 'gong' && P.skills.includes('strong')) p += 10;
        p = clamp(p, 5, 95);
        const ok = rngNext(G.rng) * 100 < p;
        let graze = false, coin = false;
        if (!ok) {
          if ((P.items.tongqian || 0) > 0) { P.items.tongqian--; graze = true; coin = true; }
          else if (rngNext(G.rng) * 100 < (P.attrs.yun || 0) * 5) graze = true;
        }
        R.rolls.push({ attr, diff, ok, graze, coin, label });
        if (coin) R.lines.push({ kind: 'see', text: '兜里那枚压岁铜钱忽然烫了一下，再摸，已经碎成两半。' });
        return { ok, graze };
      },
      hurt(n, src = '', rule = false, cause = null) {
        if (n <= 0) return;
        if (!rule && P.rope > 0) {
          n = Math.max(0, n - 10); P.rope--;
          R.lines.push({ kind: 'see', text: P.rope > 0 ? '手腕上的朱砂红绳勒紧了一下。' : '手腕上的朱砂红绳啪地断了。' });
        }
        P.hp -= n; R.dmg += n;
        if (src) R.lines.push({ kind: 'hurt', text: src });
        if (P.hp <= 0) ctx.die(cause || src);
      },
      kill(src) { P.hp = 0; ctx.die(src, true); },
      die(src, hard) {
        if ((P.items.revive || 0) > 0) {
          P.items.revive--; P.hp = 100; R.revived = true;
          R.lines.push({ kind: 'event', text: '我死了。然后我又睁开了眼睛，胸口里像被人塞进一把冷灰。复活卡没了。' });
          if (C.onRevive) C.onRevive(ctx);
          ctx.interrupt('revived');
        } else {
          P.hp = 0; R.dead = true; R.deathCause = src;
          run.over = { type: 'dead', cause: src, at: run.min };
        }
      },
      heal(n) { P.hp = Math.min(100, P.hp + n); },
      interrupt(why) { if (!R.interrupted) R.interrupted = why || 'event'; },
      end(id) { R.ending = id; run.over = { type: 'end', ending: id, at: run.min }; },
      pend(p) { run.pending = p; },
      unpend() { run.pending = null; },
      advance(min) { advance(ctx, min); },
      once(key) { if (run.fired[key]) return false; run.fired[key] = true; return true; },
    };
    return ctx;
  }

  function advance(ctx, min) {
    const run = ctx.run, C = ctx.C, R = ctx.R;
    for (let k = 0; k < min; k++) {
      run.min++;
      if (C.onMinute) C.onMinute(ctx, run.min);
      for (const ev of C.timeline) {
        if (ev.at === run.min && !run.fired[ev.id]) {
          if (ev.if && !ev.if(ctx)) { run.fired[ev.id] = true; continue; }
          run.fired[ev.id] = true;
          R.events = R.events || [];
          R.events.push(ev.id);
          ev.run(ctx);
        }
      }
      if (R.dead || R.ending || R.interrupted) return;
    }
  }

  function waitFor(ctx, st) {
    let n = st.minutes || 0;
    if (st.until) {
      const t = parseHHMM(st.until, ctx.now);
      if (t != null) n = t - ctx.now;
    }
    if (!n) n = 30;
    n = clamp(n, 1, 480);
    advance(ctx, n);
    if (!ctx.R.interrupted && !ctx.R.dead && !ctx.R.ending) ctx.fact(`我等了${n >= 60 ? Math.round(n / 6) / 10 + '个钟头' : n + '分钟'}，没出什么事。`, 'see');
  }

  /* ---------- 通用动作 ---------- */
  function generic(ctx, st) {
    const { G, C, run } = ctx;
    switch (st.type) {
      case 'look': {
        const L = C.locations[run.loc];
        ctx.fact(typeof L.desc === 'function' ? L.desc(ctx) : L.desc);
        const names = Object.keys(C.objects).filter(id => objVisible(G, id) && !run.held[id]).map(id => C.objects[id].name);
        if (names.length) ctx.note('这里能看到：' + names.join('、'));
        return;
      }
      case 'move': {
        const here = C.locations[run.loc];
        const exits = (typeof here.exits === 'function' ? here.exits(run.s, run) : here.exits) || [];
        const to = st.target;
        if (!to || !C.locations[to]) { ctx.fact('我不知道往哪儿走。'); ctx.cost = 0; return; }
        if (to === run.loc) { ctx.cost = 0; return; }
        if (!exits.includes(to)) { ctx.fact(`从这儿过不去${C.locations[to].name}。`); ctx.cost = 0; return; }
        if (C.canMove) { const why = C.canMove(ctx, to); if (why) { ctx.fact(why); return; } }
        run.loc = to;
        const L = C.locations[to];
        ctx.fact(typeof L.enter === 'function' ? L.enter(ctx) : (L.enter || (typeof L.desc === 'function' ? L.desc(ctx) : L.desc)));
        if (C.onEnter) C.onEnter(ctx, to);
        return;
      }
      case 'examine': return examine(ctx, st.target);
      case 'take': {
        const o = C.objects[st.target];
        if (!o || !objVisible(G, st.target)) { ctx.fact('没有这样东西。'); ctx.cost = 0; return; }
        if (!o.takeable) { ctx.fact(o.noTake || `${o.name}拿不走。`); return; }

      case 'recall': ctx.cost = 0; ctx.note('玩家在回想，正文只用两三句写你理了理思绪，不要编新事实。'); return;

    const { G, C, run } = ctx;
    if (C.npcs[id]) {
      if (!npcPresent(G, id)) { ctx.fact('人不在这儿。'); ctx.cost = 0; return; }
      const n = C.npcs[id];
      ctx.fact(typeof n.look === 'function' ? n.look(ctx) : n.look);
      return;
    }
    const o = C.objects[id];
    if (!o || !objVisible(G, id)) { ctx.fact('这里没有这样东西。'); ctx.cost = 0; return; }
    const seen = run.s.__seen || (run.s.__seen = {});
    const times = seen[id] || 0;
    seen[id] = times + 1;
    const deepDone = !o.deep || (run.s.__deep || {})[id] || (o.deep.when && !o.deep.when(ctx));
    if (times >= 2 && deepDone && !o.examineAlways && !o.examine && typeof o.desc !== 'function') {
      ctx.cost = 5;
      ctx.fact(`${o.name}还是那样，再看也看不出新东西了。`);
      ctx.note('玩家在原地打转。正文一两句带过，选项给他往别处走的路。');
      return;
    }
    if (o.examine) { if (o.examine(ctx) === true) return; }
    else ctx.fact(typeof o.desc === 'function' ? o.desc(ctx) : o.desc);
    if (o.clue) for (const c of [].concat(typeof o.clue === 'function' ? o.clue(ctx) : o.clue)) if (c) ctx.clue(c);
    const d = o.deep;
    if (d) {
      const deepSeen = run.s.__deep || (run.s.__deep = {});
      if (deepSeen[id]) return;
      if (d.when && !d.when(ctx)) return;
      let need = d.need - (ctx.skill('eye') ? 2 : 0);
      if (d.skill && ctx.skill(d.skill)) need = -99;
      if (ctx.attr('zhi') >= need) {

        ctx.fact(d.text);
        if (d.clue) ctx.clue(d.clue);
      } else if (d.slow && times >= 1) {

        ctx.fact(d.slowText || d.text);
        if (d.clue) ctx.clue(d.clue);
      } else if (d.hint) {

      }

  }

  function useShopItem(ctx, it, st) {
    const P = ctx.P;
    if (it === 'anshen') {
      P.items.anshen--; ctx.cost = 1;
      ctx.heal(25);
      ctx.fact('我把安神丸干咽下去，苦得舌根发麻。过了一会儿，手不抖了。');

    }
    ctx.fact('这东西不用拿出来，带在身上就行。');
    ctx.cost = 0;

  /* ---------- 给叙事层的场景 ---------- */
  function scene(G) {
    const C = caseOf(G), run = G.run;
    const L = C.locations[run.loc];
    const objs = Object.keys(C.objects).filter(id => objVisible(G, id)).map(id => C.objects[id].name + (run.held[id] ? '（在你手里）' : ''));
    const npcs = Object.keys(C.npcs).filter(id => npcPresent(G, id)).map(id => {
      const n = C.npcs[id];

  }

  function suggest(G) {

    if (!C.suggest) return [];

  /* 选项自带的动作单能不能用：对象得是此刻看得见的 */
  function stepOk(G, st) {

    const t = st.target;

      if (C.npcs[t] && !npcPresent(G, t)) return false;

/* 定式库：把"每夜一份数据"编成引擎认得的案件对象。

const Kit = (() => {
  /* 星级决定压得多紧 */
  const STAR = {
    1: { hurt: 15, acceptToDie: 3, wrongToDie: 2, lampSpan: 240, refill: 300, darkHurt: 15, darkTurns: 4, doorHurt: 30, doorToDie: 2, stakeDiff: 'easy', points: 50 },
    2: { hurt: 20, acceptToDie: 3, wrongToDie: 2, lampSpan: 210, refill: 270, darkHurt: 20, darkTurns: 3, doorHurt: 40, doorToDie: 2, stakeDiff: 'easy', points: 400 },
    3: { hurt: 25, acceptToDie: 3, wrongToDie: 2, lampSpan: 180, refill: 240, darkHurt: 25, darkTurns: 3, doorHurt: 50, doorToDie: 2, stakeDiff: 'normal', points: 1000 },
    4: { hurt: 30, acceptToDie: 2, wrongToDie: 1, lampSpan: 170, refill: 220, darkHurt: 30, darkTurns: 2, doorHurt: 60, doorToDie: 1, stakeDiff: 'normal', points: 2500 },
    5: { hurt: 35, acceptToDie: 2, wrongToDie: 1, lampSpan: 150, refill: 200, darkHurt: 35, darkTurns: 2, doorHurt: 70, doorToDie: 1, stakeDiff: 'hard', points: 6000 },
  };
  const PRESSURE_KEYS = { '灯不能灭': 'lamp', '门不能开': 'door', '别应': 'call', '诱惑': 'tempt', '封路': 'block' };
  const CN = { 零: 0, 一: 1, 二: 2, 两: 2, 俩: 2, 三: 3, 仨: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
  const arr = v => (v == null ? [] : Array.isArray(v) ? v : [v]);
  const norm = t => String(t || '').replace(/[\s「」“”"'。，,.！!？?、：:；;（）()]/g, '');

  function compile(D) {
    const star = clamp(D.star || 1, 1, 5);
    const K = STAR[star];
    const P = {};
    for (const p of arr(D.pressures)) if (PRESSURE_KEYS[p]) P[PRESSURE_KEYS[p]] = (D.pressure_params || {})[p] || {};
    const startDay = parseClock(D.start_time);
    const tm = s => {
      const t = parseClock(s);
      if (t == null) return null;
      return t < startDay ? t + 1440 : t;
    };
    const START = startDay, DEADLINE = tm(D.deadline);
    const ACT1 = tm((D.acts || {}).probe_until) || START + Math.round((DEADLINE - START) / 3);
    const ACT2 = tm((D.acts || {}).press_until) || START + Math.round((DEADLINE - START) * 2 / 3);
    const PZ = D.puzzle || {};
    const pt = D.puzzle_type;
    const byId = list => Object.fromEntries(arr(list).map(x => [x.id, x]));
    const LOCS = byId(D.locations), OBJS = byId(D.objects), NPCS = byId(D.npcs);

    /* ---------- 条件 ---------- */
    // 写法："solved+clue:c_a+!held:x"。状态项随时能判；动作项（topic: show: give: to: use: say）要带着这一步判。
    function cond(env, expr, st) {
      if (expr == null || expr === '' || expr === 'always' || expr === true) return true;
      if (expr === 'puzzle_unsolved') return !env.s.solved;
      if (expr === 'puzzle_solved') return !!env.s.solved;
      return String(expr).split('+').every(raw => {
        let term = raw.trim(), neg = false;
        if (term.startsWith('!')) { neg = true; term = term.slice(1); }
        const r = term1(env, term, st);
        return neg ? !r : r;
      });
    }
    function term1(env, term, st) {
      const [k, v] = term.includes(':') ? [term.slice(0, term.indexOf(':')), term.slice(term.indexOf(':') + 1)] : [term, ''];
      const s = env.s, run = env.run;
      switch (k) {
        case 'solved': return !!s.solved;
        case 'unsolved': return !s.solved;
        case 'warm': return !!s.warm;
        case 'clue': return !!run.clues[v];
        case 'examined': return !!(s.__seen || {})[v];
        case 'event': return !!run.fired[v];
        case 'held': return !!run.held[v];
        case 'loc': return run.loc === v;
        case 'flag': return !!s.flags[v];
        case 'pressure': return !!P[PRESSURE_KEYS[v] || v];
        case 'after': return run.min >= tm(v);
        case 'before': return run.min < tm(v);
        case 'dark': return !!s.dark;
        // 动作项
        case 'topic': return !!st && st.topic === v;
        case 'show': return !!st && st.type === 'show' && st.target === v;
        case 'give': return !!st && st.type === 'give' && st.target === v;
        case 'to': return !!st && st.to === v;
        case 'use': return !!st && st.type === 'use' && st.target === v;
        case 'say': return !!st && st.type === 'say' && (!v || norm(st.text).includes(norm(v)));
        default: return false;
      }
    }
    const stateOnly = expr => String(expr || '').split('+').filter(t => !/^!?(topic|show|give|to|use|say):/.test(t.trim())).join('+');
    const env = (s, run) => ({ s, run });
    const pickState = (states, ctx, base) => {
      for (const x of arr(states)) if (cond(ctx, x.if)) return x.text;
      return base;
    };

    /* ---------- 地点 ---------- */
    const locations = {};
    for (const L of arr(D.locations)) {
      locations[L.id] = {
        name: L.name, alias: L.alias || [],
        exits: (s) => arr(L.exits).filter(x => !(s.blocked && s.blocked[x])),
        desc: L.states ? (ctx => pickState(L.states, ctx, L.desc)) : L.desc,
        enter: L.enter ? (L.states ? (ctx => pickState(L.states, ctx, L.enter)) : L.enter) : undefined,
        goLabel: L.go_label,
      };
    }

    /* ---------- 物件 ---------- */
    const objects = {};
    for (const O of arr(D.objects)) {
      const o = {
        name: O.name, alias: O.alias || [], loc: O.loc, takeable: !!O.takeable,
        desc: O.states ? (ctx => pickState(O.states, ctx, O.first_glance)) : O.first_glance,
        clue: arr(O.clues).length ? arr(O.clues) : null,
        label: O.label,
        noTake: O.no_take,
        onTake: O.on_take,
      };
      if (O.hidden_until) o.hidden = (s, run) => !cond(env(s, run), O.hidden_until);
      if (O.closer && O.closer.text) {
        o.deep = {
          need: O.closer.need ?? 4, slow: O.closer.slow !== false, text: O.closer.text,
          slowText: O.closer.slow_text, hint: O.closer.hint, skill: O.closer.skill,
          clue: arr(O.closer.clues || O.closer.clue)[0] || null,
        };
      }
      objects[O.id] = o;
    }

    /* ---------- 人物 ---------- */
    const npcs = {};
    for (const N of arr(D.npcs)) {
      const kw = {};
      for (const [k, v] of Object.entries(N.keywords || {})) { try { kw[k] = new RegExp(v); } catch (e) { /* 坏正则就不要了 */ } }
      npcs[N.id] = {
        name: N.name, alias: N.alias || [], voice: N.voice || '',
        where: (s, run) => npcWhere(N, s, run),
        hearFrom: N.hear_from ? ((s, run) => (s.solved && N.id === PZ.caller ? [] : arr(N.hear_from))) : undefined,
        look: N.look || `${N.name}就在那儿。`,
        stateText: N.state_text ? (s => pickStateText(N.state_text, s)) : undefined,
        topics: N.topics || {},
        topicKeywords: kw,
      };
    }
    function npcWhere(N, s, run) {
      if (N.id === PZ.caller && s.solved && !N.stay_after_solved) return null;
      if (typeof N.where === 'string' || N.where == null) return N.where || null;
      let at = null;
      for (const w of arr(N.where)) {
        const okT = !w.from || run.min >= tm(w.from);
        const okC = !w.if || cond(env(s, run), w.if);

      }

    }
    function pickStateText(list, s) { for (const x of arr(list)) if (!x.if || cond({ s, run: { clues: {}, fired: {}, held: {}, min: 0 } }, x.if)) return x.text; return ''; }

    /* ---------- 线索 ---------- */
    const clues = {};
    for (const c of arr(D.clues)) clues[c.id] = { kind: c.kind || 'seen', text: c.text };
    if (P.call) clues._accepted = { kind: 'seen', text: P.call.accept_clue || `我应了一声，身上就有地方不对了。` };
    if (P.tempt) clues._tempt = { kind: 'seen', text: P.tempt.clue || `我接了那份好处。` };

    /* ---------- 理解层要判的布尔 ---------- */
    const flags = [];
    const callName = P.call ? (P.call.name || PZ.wrong_name || '') : '';
    if (P.call) flags.push({
      key: 'accept_name',
      q: `这句话是不是在答应别人叫的“${callName}”，或者承认自己就是“${callName}”？答“在”“哎”“嗯”“是我”“来了”算 true；问“谁”、否认、不出声、跟屋里的人正常说话，都是 false。`,
      when: s => !s.solved,

    });
    if (P.tempt) flags.push({
      key: 'accept_offer',
      q: `这句话是不是在接受这个提议：「${P.tempt.offer}」？答应、照它说的做，算 true；拒绝、反问、不理，算 false。`,
      when: (s, run) => !!(run.pending && run.pending.kind === 'offer'),
      offline: (t, said) => /^(好|行|成|依你|在|哎|嗯|应|答应)/.test(String(said || t).trim()) || /我答应/.test(t),
    });
    if (D.stake && D.stake.npc) flags.push({
      key: 'stop_stake',
      q: `这句话是不是在叫${(NPCS[D.stake.npc] || {}).name || '那个人'}站住、别应、别出声、别过去？`,
      when: (s, run) => !!(run.pending && run.pending.kind === 'stake'),
      offline: t => /别(应|出声|答|去|过去|开)|站住|等等|不要(应|去|开)/.test(t),

          if (text) ctx.must(text);

    if (P.call) {
      const calls = arr(P.call.calls);
      calls.forEach((c, i) => {
        const at = tm(c.at) || Math.round(START + 60 + i * ((ACT2 + 30 - START - 60) / Math.max(1, calls.length - 1)));
        timeline.push({
          id: 'call' + i, at,
          if: ctx => !ctx.s.solved && ctx.now >= ctx.s.quietUntil,
          run(ctx) {
            ctx.pend({ kind: 'call', from: PZ.caller || P.call.caller, desc: `有个声音在叫“${callName}”，在等人应` });
            ctx.must(c.text || c);
            if (c.clue) for (const id of arr(c.clue)) ctx.clue(id);
            ctx.interrupt('call');
          },
        });
      });
    }
    // 诱惑：两次开口
    if (P.tempt) {
      const offers = [tm(P.tempt.at) || Math.round((ACT1 + ACT2) / 2), tm(P.tempt.again_at) || ACT2 + 20];
      offers.forEach((at, i) => timeline.push({
        id: 'offer' + i, at,
        if: ctx => !ctx.s.solved && ctx.s.tempts < 2 && !(ctx.run.pending && ctx.run.pending.kind === 'offer'),

    }
    // 门：敲门

        const at = tm(k.at) || Math.round(START + 45 + i * ((DEADLINE - 60 - START - 45) / Math.max(1, knocks.length - 1)));
        timeline.push({
          id: 'knock' + i, at,
          if: ctx => !ctx.s.solved || P.door.after_solved,
          run(ctx) {
            ctx.pend({ kind: 'knock', desc: '有人在敲门、叫门，在等人开' });

          },

    /* ---------- 主谜 ---------- */
    const accNames = arr(PZ.true_name).concat(arr(PZ.accept_names)).filter(Boolean);
    function finish(ctx) {
      const s = ctx.s;

        ctx.must(PZ.collect_text || '');
        return judgeBook(ctx);
      }
      if (s.solved) return ctx.end(s.warm && D.endings.warm ? 'warm' : 'good');
      if (s.stakePaid) return ctx.end('bad');
      return ctx.end('partial');
    }
    function solve(ctx, text) {
      ctx.s.solved = true;
      if (text) ctx.must(text);
      if (ctx.run.pending && ['call', 'offer', 'knock', 'stake'].includes(ctx.run.pending.kind)) ctx.unpend();
      ctx.s.dark = false;
      ctx.note('主谜解开了。屋里的东西不再找人，正文写出松下来的那一下，但别写成大团圆。');
    }
    function writeName(ctx, st) {
      const s = ctx.s;
      const t = norm(st.text);
      if (!t) { ctx.fact('笔尖悬在那儿，我一时不知道该写什么。'); return true; }
      if (s.solved) { ctx.fact('名字已经写上了，墨还新。'); return true; }
      if (accNames.some(n => t.includes(norm(n)))) { s.written = st.text; solve(ctx, PZ.solved_text); return true; }
      s.wrong++;
      ctx.must(PZ.wrong_text || '墨一落上去就洇开了，洇成一摊水印子，什么字也看不出来。');
      if (s.wrong >= K.wrongToDie) ctx.kill('wrongname');
      else ctx.hurt(K.hurt, '写错的那几个字像是写在我身上，皮肤底下一阵发紧。', true, 'wrongname');
      return true;
    }
    // 记数：从一段话里认出每个人后面跟的数。数只在这个人的名字之后、下一个人的名字之前找。
    function parseBook(text) {
      const t = String(text || '');
      const out = {};
      const who = arr(PZ.guests).map(g => ({ id: g.npc || g.id, names: [g.name, ...arr(g.alias), ...(NPCS[g.npc] ? [NPCS[g.npc].name, ...arr(NPCS[g.npc].alias)] : [])].filter(n => n && n.length >= 1) }));
      who.push({ id: '_me', names: ['我', '自己', '本人'] });
      const hits = [];
      for (const w of who) {
        let at = -1, len = 0;
        for (const n of w.names) { const i = t.indexOf(n); if (i >= 0 && (at < 0 || i < at || (i === at && n.length > len))) { at = i; len = n.length; } }
        if (at >= 0) hits.push({ id: w.id, at, end: at + len });
      }
      hits.sort((a, b) => a.at - b.at);
      hits.forEach((h, k) => {
        const seg = t.slice(h.end, k + 1 < hits.length ? hits[k + 1].at : t.length).slice(0, 16);
        if (/一大一小|娘俩|娘儿俩|母女俩|父子俩|两口子/.test(seg)) { out[h.id] = 2; return; }
        const m = /(\d+|[一二两俩三仨四五六七八九十])\s*(个|口|人|位)?/.exec(seg);
        out[h.id] = m ? (/\d/.test(m[1]) ? +m[1] : CN[m[1]]) : 1;
      });
      return out;
    }
    function bookOk(book) {
      for (const g of arr(PZ.guests)) if ((book[g.npc || g.id] || 0) !== g.real) return false;
      if (book._me != null && book._me !== 1) return false;
      return true;
    }
    function judgeBook(ctx) {
      const s = ctx.s;
      s.submitted = true;
      if (bookOk(s.book)) { solve(ctx, PZ.solved_text); return ctx.end(s.warm && D.endings.warm ? 'warm' : 'good'); }
      ctx.must(PZ.wrong_text || '');
      if (D.stake && D.stake.npc === 'me') return ctx.kill('kept');
      s.stakePaid = true;
      return ctx.end('bad');
    }

    /* ---------- 动作 ---------- */
    function act(ctx, st) {
      const s = ctx.s, run = ctx.run, first = ctx.R.steps.length === 1;
      const pend = run.pending;

      // 赌注：这回合第一下
      if (first && pend && pend.kind === 'stake') {
        if (st.type === 'write' && st.target === PZ.marker) {
          writeName(ctx, st);
          if (s.solved) ctx.must(D.stake.saved_text || '');
          return true;
        }
        ctx.unpend();
        const isStop = (st.type === 'stop' && st.to === D.stake.npc) || (st.type === 'say' && (st.flags.stop_stake || st.to === D.stake.npc));
        if (isStop) {
          const r = ctx.roll('min', K.stakeDiff, '抢在那一声之前');
          if (r.ok || r.graze) { s.stakeHeld = true; ctx.must(D.stake.stop_text); ctx.cost = 2; return true; }
        }
        s.stakePaid = true;
        ctx.must(D.stake.fail_text);
        ctx.note('那个活人应了。后面的事已经定了，只等天亮。');
        if (isStop) return true;
      }

      // 诱惑
      if (pend && pend.kind === 'offer' && st.flags && st.flags.accept_offer) { ctx.unpend(); return takeOffer(ctx); }

      // 别应
      if (P.call && !s.solved && st.type === 'say' && st.flags && st.flags.accept_name &&
        (st.to === PZ.caller || !st.to || st.to === 'none' || (pend && pend.kind === 'call'))) {
        return answerCall(ctx);
      }

      switch (st.type) {
        case 'write': {
          if (pt === '认名' && st.target === PZ.marker) return writeName(ctx, st);
          if (pt === '记数' && st.target === PZ.register) {
            if (!ctx.held(PZ.register) && !ctx.visible(PZ.register)) return false;
            s.book = Object.assign({}, parseBook(st.text));
            s.bookText = st.text;
            ctx.fact(`我在${OBJS[PZ.register].name}上写：「${st.text}」`);
            ctx.cost = 10;
            return true;
          }
          return false;
        }
        case 'say': {
          // 对着叫名的那个念真名
          if (pt === '认名' && !s.solved && accNames.some(n => norm(st.text).includes(norm(n))) && (st.to === PZ.caller || ctx.present(PZ.caller))) {
            if (ctx.once('name_test')) {
              ctx.must(PZ.test_text || '我念出那个名字。屋里静了一下。');
              if (PZ.test_clue) ctx.clue(PZ.test_clue);
            } else ctx.fact('我又念了一遍那个名字。没有回音。');
            if (pend && pend.kind === 'call') ctx.unpend();
            return true;
          }
          if (st.to && NPCS[st.to]) return talk(ctx, st, st.to);
          return false;
        }
        case 'show': case 'give': {
          if (!st.to || !NPCS[st.to] || !ctx.present(st.to)) return false;
          if (pt === '记数' && st.type === 'give' && st.target === PZ.register && st.to === PZ.keeper) {
            if (PZ.submit_after && ctx.now < tm(PZ.submit_after)) { ctx.fact(PZ.too_early || `${NPCS[st.to].name}摆摆手：「天亮了再交。」`); return true; }
            ctx.unhold(PZ.register);
            return judgeBook(ctx), true;
          }
          return talk(ctx, st, st.to);
        }
        case 'use': return useThing(ctx, st);
        case 'open': {
          if (P.door && st.target === P.door.door) return openDoor(ctx);
          const L = LOCS[st.target];
          if (L && L.lock) return unlock(ctx, st.target);
          return false;
        }
        case 'move': {
          if (P.door && P.door.outside && st.target === P.door.outside && !s.solved && ctx.now < DEADLINE) return openDoor(ctx);
          return false;
        }
        case 'stop': {
          if (D.stake && st.to === D.stake.npc && ctx.present(st.to)) { ctx.fact('我拦在他跟前。他看了我一眼，没动。'); return true; }
          return false;
        }
        case 'hide': ctx.fact('我缩到墙角。屋里就这么大，没有哪里藏得住人。'); return true;
      }
      return false;
    }

    function talk(ctx, st, id) {
      const N = NPCS[id], s = ctx.s;
      if (!ctx.present(id)) { ctx.fact('人不在这儿。'); ctx.cost = 0; return true; }
      // 温情目标
      if (D.warm && !s.warm && cond(ctx, D.warm.when, st)) {
        s.warm = true;
        ctx.must(D.warm.text);
        if (D.warm.clue) ctx.clue(D.warm.clue);
        return true;
      }
      const done = s.revealed;
      const reveals = arr(N.reveals);
      for (let i = 0; i < reveals.length; i++) {
        const rv = reveals[i], key = id + ':' + i;
        if (done[key] || (rv.clue && ctx.hasClue(rv.clue) && rv.once !== false)) continue;
        if (!cond(ctx, rv.when, st)) continue;
        done[key] = true;
        if (rv.says) ctx.say(id, rv.says);
        if (rv.does) ctx.must(rv.does);
        if (rv.clue) for (const c of arr(rv.clue)) ctx.clue(c);
        if (rv.set) for (const f of arr(rv.set)) s.flags[f] = true;
        return true;
      }
      if (st.type === 'show' || st.type === 'give') {
        const o = OBJS[st.target];
        ctx.fact(`${N.name}看了一眼${o ? o.name : '那东西'}，没说什么。`);
        return true;
      }
      const ans = (N.answers || {})[st.topic];
      if (ans) { ctx.say(id, typeof ans === 'string' ? ans : ans.says); return true; }
      if (N.idle) { ctx.say(id, N.idle); return true; }
      ctx.fact(`${N.name}没接话。`);
      return true;
    }

    function answerCall(ctx) {
      const s = ctx.s;
      s.accepts++;
      if (ctx.run.pending && ctx.run.pending.kind === 'call') ctx.unpend();
      const imgs = arr(P.call.accept_images);
      ctx.must(imgs[Math.min(s.accepts, imgs.length) - 1] || '我应了一声。应完我就知道不对了。');
      ctx.clue('_accepted');
      if (s.accepts >= K.acceptToDie) return ctx.kill('accept'), true;
      ctx.hurt(K.hurt, '应出去的那一声，像从身上抽走了点什么。', true, 'accept');
      return true;
    }

    function offer(ctx) {
      const T = P.tempt;
      ctx.pend({ kind: 'offer', tempt: true, from: T.giver, desc: `有个声音许了一样好处：${T.offer}` });
      ctx.must(ctx.s.tempts ? (T.again_text || T.offer) : (T.offer_text || T.offer));
      ctx.note('这个提议是真的，接了真给好处。不要替玩家决定。');
      ctx.interrupt('offer');
    }
    function takeOffer(ctx) {
      const s = ctx.s, T = P.tempt;
      s.tempts++;
      if (s.tempts >= 2) return ctx.kill('tempt'), true;
      ctx.must(T.first_image);
      ctx.clue('_tempt');
      const g = T.gives || 'quiet';
      if (g === 'light' && P.lamp) { s.lampLit = true; s.dark = false; s.darkTurns = 0; s.lampEnd = Math.max(s.lampEnd, ctx.now + 120); }
      if (g === 'heal') ctx.heal(30);
      if (g === 'light' || g === 'quiet') s.quietUntil = ctx.now + 90;
      if (String(g).startsWith('clue:')) ctx.clue(g.slice(5));
      return true;
    }

    // 黑里每待一刻钟挨一下，待够了就没命
    function darkTick(ctx) {
      const s = ctx.s;
      if (ctx.now < s.darkCalmUntil) return;
      s.darkTurns++;
      if (s.darkTurns >= K.darkTurns) return ctx.kill('dark');
      ctx.hurt(K.darkHurt, P.lamp.dark_hurt_text || '黑里有东西碰了我一下，凉的。', true, 'dark');
      ctx.interrupt('dark_tick');
    }

    function useThing(ctx, st) {
      const s = ctx.s, t = st.target;
      if (P.lamp && (t === P.lamp.fuel || t === P.lamp.lamp)) {
        if (s.fuelUsed) {
          if (s.lampLit) { ctx.fact(P.lamp.no_fuel_text || '灯里的油还够，再添也添不进去了。'); return true; }
          ctx.fact(P.lamp.no_fuel_text || '油壶早空了，灯芯点不着。'); return true;
        }
        if (!ctx.visible(P.lamp.fuel) && !ctx.held(P.lamp.fuel)) { ctx.fact(`${OBJS[P.lamp.fuel].name}不在手边。`); return true; }
        if (!ctx.visible(P.lamp.lamp)) { ctx.fact(`得先回到${OBJS[P.lamp.lamp].name}跟前。`); return true; }
        s.fuelUsed = true;
        if (s.lampLit) { s.lampEnd += K.refill; ctx.fact(P.lamp.fuel_text || '我把油添进灯里。灯苗往上一蹿，亮了一圈。'); }
        else {
          s.lampLit = true; s.dark = false; s.darkTurns = 0; s.lampEnd = ctx.now + K.refill;
          ctx.must(P.lamp.relight_text || '灯又亮了。屋里的东西都还在原处，可我不敢肯定它们一直在原处。');
        }
        ctx.cost = 5;
        return true;
      }
      return false;
    }

    function openDoor(ctx) {
      const s = ctx.s;
      if (s.solved && !P.door.after_solved) return false;
      s.doorOpened++;
      if (ctx.run.pending && ctx.run.pending.kind === 'knock') ctx.unpend();
      const imgs = arr(P.door.open_images || P.door.open_image);
      ctx.must(imgs[Math.min(s.doorOpened, imgs.length) - 1] || '我拉开了门。');
      if (s.doorOpened >= K.doorToDie) return ctx.kill('door'), true;
      ctx.hurt(K.doorHurt, '门外那股冷气撞在我身上。', true, 'door');
      return true;
    }

    function unlock(ctx, to) {
      const L = LOCS[to];
      if (!L || !L.lock || ctx.s.unlocked[to]) return false;
      if (ctx.held(L.lock.key)) { ctx.s.unlocked[to] = true; ctx.fact(L.lock.open_text || `我用${OBJS[L.lock.key].name}打开了门。`); return true; }
      ctx.fact(L.lock.fail_text || '锁着。');
      return true;
    }

    function canMove(ctx, to) {
      const s = ctx.s, L = LOCS[to];
      if (s.blocked[to]) return P.block.block_text || '那边过不去了。';
      if (L && L.lock && !s.unlocked[to]) {
        if (ctx.held(L.lock.key)) { s.unlocked[to] = true; return null; }
        return L.lock.fail_text || '锁着。';
      }
      return null;
    }

    /* ---------- 每分钟 ---------- */
    function onMinute(ctx, t) {
      const s = ctx.s;
      if (P.lamp && s.lampLit && t >= s.lampEnd) {
        s.lampLit = false;
        if (!s.solved) {
          s.dark = true; s.darkTurns = 0; s.darkNext = t + 15;
          ctx.must(P.lamp.dark_image);
          ctx.note('灯灭了。黑里每做一件事都要挨一下，得赶紧把灯点上，或者解开那道题。');
          ctx.interrupt('dark');
          if (P.tempt && s.tempts < 2 && P.tempt.in_dark !== false && ctx.once('offer_dark')) offer(ctx);
        } else ctx.fact(P.lamp.out_after_solved || '灯油烧干了，灯苗慢慢矮下去，灭了。屋里很安静。');
      } else if (P.lamp && s.dark && !s.solved && t >= s.darkNext) {
        s.darkNext = t + 15;
        darkTick(ctx);
      }
    }

    function check(ctx) {
      const s = ctx.s, run = ctx.run;
      if (run.pending && run.pending.kind === 'stake' && s.solved) { ctx.unpend(); if (D.stake.saved_text) ctx.must(D.stake.saved_text); }
      // 温情目标也可以是不带人物的动作
      if (D.warm && !s.warm && D.warm.solo && s.solved && cond(ctx, D.warm.when)) { s.warm = true; ctx.must(D.warm.text); }
    }

    function onIncense(ctx) {
      const s = ctx.s, p = ctx.run.pending;
      if (p && (p.kind === 'call' || p.kind === 'knock')) {
        s.quietUntil = ctx.now + 60; ctx.unpend();
        ctx.fact(D.incense_text || '香点着了，烟往门缝那边飘。外头的声音闭了嘴，过了好一会儿才走远。');
        return true;
      }
      if (s.dark) { s.darkCalmUntil = ctx.now + 30; ctx.fact('香点着了，那点红光在黑里一明一暗。黑里的东西退开了一点，只一点。'); return true; }
      return false;
    }
    function onRevive(ctx) {
      const s = ctx.s;
      if (s.dark) { s.dark = false; s.lampLit = true; s.lampEnd = ctx.now + 120; s.darkTurns = 0; }
      if (s.accepts >= K.acceptToDie) s.accepts = K.acceptToDie - 1;
      if (s.tempts >= 2) s.tempts = 1;
      if (s.wrong >= K.wrongToDie) s.wrong = K.wrongToDie - 1;
      if (s.doorOpened >= K.doorToDie) s.doorOpened = K.doorToDie - 1;
    }

    /* ---------- 建议 ---------- */
    function suggest(ctx) {
      const s = ctx.s, run = ctx.run, p = run.pending, o = [];
      const caller = PZ.caller && NPCS[PZ.caller];
      // 名字认得出来：主谜来源线索拿到两条（只有一条来源就一条）；只拿到一条，给"写名字"的空选项，不替他填
      const srcKnown = arr(PZ.name_sources).filter(id => run.clues[id]).length;
      const knowName = () => srcKnown >= Math.min(2, arr(PZ.name_sources).length || 1);
      const someName = () => srcKnown >= 1;
      const trueName = accNames[0];
      if (p && p.kind === 'stake') {
        const nm = (NPCS[D.stake.npc] || {}).name || '他';
        o.push({ label: D.stake.stop_label || `扑过去拦住${nm}`, steps: [{ type: 'stop', to: D.stake.npc, how: '拦住' }] });
        o.push({ label: `冲${nm}喊：「别应！」`, steps: [{ type: 'say', to: D.stake.npc, text: '别应！', flags: { stop_stake: true, accept_name: false } }] });
        if (pt === '认名' && knowName() && ctx.visible(PZ.marker)) o.push({ label: `抢过笔，在${OBJS[PZ.marker].name}上写「${trueName}」`, steps: [{ type: 'write', target: PZ.marker, text: trueName }] });
        o.push({ label: '什么也不做，看着', steps: [{ type: 'wait', minutes: 1 }] });
        return o;
      }
      if (p && p.kind === 'offer') {
        if (s.dark && P.lamp) lampOpts(ctx, o);
        o.push({ label: '不理它', steps: [{ type: 'wait', minutes: 2 }] });
        o.push({ label: P.tempt.accept_label || '依了它', steps: [{ type: 'say', to: P.tempt.giver || 'none', text: '好。', flags: { accept_offer: true, accept_name: false } }] });
        return o;
      }
      if (s.dark && !s.solved) {
        lampOpts(ctx, o);
        if (pt === '认名' && knowName() && ctx.visible(PZ.marker)) o.push({ label: `摸黑在${OBJS[PZ.marker].name}上写「${trueName}」`, steps: [{ type: 'write', target: PZ.marker, text: trueName }] });
        const ex = locations[ctx.loc].exits(s).filter(x => !s.blocked[x])[0];
        if (ex) o.push({ label: `摸黑退到${LOCS[ex].name}去`, steps: [{ type: 'move', target: ex }] });
        if (o.length < 3) o.push({ label: '咬着牙，一动不动', steps: [{ type: 'wait', minutes: 5 }] });
        return o.slice(0, 4);
      }
      if (p && p.kind === 'call') {
        o.push({ label: '不出声，等它过去', steps: [{ type: 'wait', minutes: 5 }] });
        o.push({ label: '问：「你是谁？」', steps: [{ type: 'say', to: PZ.caller || 'none', text: '你是谁？', topic: 'who', flags: { accept_name: false } }] });
        if (pt === '认名' && knowName() && caller) o.push({ label: `叫它：「${trueName}。」`, steps: [{ type: 'say', to: PZ.caller, text: trueName + '。', topic: 'name', flags: { accept_name: false } }] });
        return o;
      }
      if (p && p.kind === 'knock') {
        o.push({ label: '不出声，等它过去', steps: [{ type: 'wait', minutes: 5 }] });
        o.push({ label: '隔着门问：「谁？」', steps: [{ type: 'say', to: 'none', text: '谁？', flags: {} }] });
        if (ctx.visible(P.door.door)) o.push({ label: P.door.open_label || '去把门打开', steps: [{ type: 'open', target: P.door.door }] });
        return o;
      }
      // 事情办完了：只剩等天亮
      if (s.solved && (s.warm || !D.warm) && pt !== '记数') return [];
      // 主谜往前走
      if (pt === '认名' && !s.solved && ctx.visible(PZ.marker) && someName()) o.push({ label: `在${OBJS[PZ.marker].name}上写名字`, steps: [], prefill: `在${OBJS[PZ.marker].name}上写：` });
      if (pt === '记数' && !s.submitted) {
        const reg = OBJS[PZ.register];
        if ((ctx.held(PZ.register) || ctx.visible(PZ.register)) && run.turn > 2) o.push({ label: `在${reg.name}上记几笔`, steps: [], prefill: `在${reg.name}上写：` });
        if (s.bookText && ctx.present(PZ.keeper) && (!PZ.submit_after || ctx.now >= tm(PZ.submit_after))) o.push({ label: `把${reg.name}交给${NPCS[PZ.keeper].name}`, steps: [{ type: 'give', target: PZ.register, to: PZ.keeper }] });
      }
      if (D.warm && !s.warm && D.warm.steps && cond(ctx, stateOnly(D.warm.when))) {
        const okSteps = D.warm.steps.every(st => Engine.stepOk(ctx.G, st));
        const need = D.warm.steps.map(st => ['give', 'show'].includes(st.type) && st.target).find(t => t && OBJS[t] && OBJS[t].takeable && !ctx.held(t) && ctx.visible(t));
        if (need && (ctx.s.__seen || {})[need]) o.push({ label: `把${OBJS[need].name}拿上`, steps: [{ type: 'take', target: need }] });
        else if (okSteps) o.push({ label: D.warm.label, steps: clone(D.warm.steps) });
        else if (D.warm.prep_steps && D.warm.prep_steps.every(st => Engine.stepOk(ctx.G, st)) && D.warm.prep_steps.some(st => st.type === 'move' && st.target !== ctx.loc && locations[ctx.loc].exits(s).includes(st.target))) o.push({ label: D.warm.prep_label, steps: clone(D.warm.prep_steps) });
      }
      // 灯
      if (P.lamp && s.lampLit && !s.fuelUsed && s.lampEnd - ctx.now < 150 && ctx.visible(P.lamp.lamp) && (ctx.visible(P.lamp.fuel) || ctx.held(P.lamp.fuel))) o.push({ label: P.lamp.fuel_label || `往${OBJS[P.lamp.lamp].name}里添油`, steps: [{ type: 'use', target: P.lamp.fuel }] });
      if (P.lamp && s.lampLit && !s.fuelUsed && s.lampEnd - ctx.now < 150 && !ctx.held(P.lamp.fuel) && ctx.visible(P.lamp.fuel) && OBJS[P.lamp.fuel].takeable && !ctx.visible(P.lamp.lamp)) o.push({ label: `把${OBJS[P.lamp.fuel].name}带上`, steps: [{ type: 'take', target: P.lamp.fuel }] });
      // 人：能让他松口的
      for (const id of Object.keys(NPCS)) {
        if (!ctx.present(id) || o.length >= 3) continue;
        const N = NPCS[id];
        arr(N.reveals).forEach((rv, i) => {
          if (o.length >= 3 || s.revealed[id + ':' + i] || (rv.clue && ctx.hasClue(rv.clue))) return;
          if (!cond(ctx, stateOnly(rv.when))) return;
          const st = stepFor(ctx, id, rv);
          if (st) o.push({ label: rv.label || labelFor(id, st), steps: [st] });
        });
      }
      // 没看过的东西
      const seen = s.__seen || {};
      for (const id of Object.keys(OBJS)) {
        if (o.length >= 3) break;
        if (!ctx.visible(id) || seen[id] || ctx.held(id) || OBJS[id].no_suggest) continue;
        o.push({ label: OBJS[id].label || `看看${OBJS[id].name}`, steps: [{ type: 'examine', target: id }] });
      }
      // 没问过的话
      for (const id of Object.keys(NPCS)) {
        if (!ctx.present(id) || o.length >= 3 || id === PZ.caller) continue;
        const asked = s.asked[id] || {};
        const tk = Object.keys(NPCS[id].topics || {}).find(k => !asked[k]);
        if (tk) o.push({ label: `问${NPCS[id].name}：${NPCS[id].topics[tk].replace(/^问(他|她)?/, '')}`, steps: [{ type: 'say', to: id, text: NPCS[id].topics[tk], topic: tk, flags: {} }] });
      }
      // 去别处：先去有事可做的地方（最近的那个，一回合走过去），再去没去过的，最后去去过的
      const lead = nearestWork(ctx);
      if (lead && o.length < 4) o.push({ label: LOCS[lead[lead.length - 1]].go_label || `去${LOCS[lead[lead.length - 1]].name}`, steps: lead.map(x => ({ type: 'move', target: x })) });
      const exits = locations[ctx.loc].exits(s);
      const fresh = exits.filter(x => !s.visited[x]), old = exits.filter(x => s.visited[x]);
      for (const x of fresh.concat(old)) {
        if (o.length >= 4) break;
        if (o.some(q => q.steps.length && q.steps[q.steps.length - 1].target === x && q.steps[0].type === 'move')) continue;
        o.push({ label: LOCS[x].go_label || `去${LOCS[x].name}`, steps: [{ type: 'move', target: x }] });
      }
      return o.slice(0, 4);
    }
    // 哪间屋里还有没看过的东西、没问出来的话：按通道找最近的，返回一路要走的地点
    function workAt(ctx, L) {
      const s = ctx.s, run = ctx.run, seen = s.__seen || {};
      for (const O of arr(D.objects)) {
        const at = (s.__loc && s.__loc[O.id]) || O.loc;
        if (at !== L || run.held[O.id] || seen[O.id] || O.no_suggest) continue;
        if (O.hidden_until && !cond(ctx, O.hidden_until)) continue;
        return true;
      }
      for (const N of arr(D.npcs)) {
        if (npcWhere(N, s, run) !== L) continue;
        if (arr(N.reveals).some((rv, i) => !s.revealed[N.id + ':' + i] && !(rv.clue && run.clues[rv.clue]) && cond(ctx, stateOnly(rv.when)) && stepFor(ctx, N.id, rv))) return true;
      }
      return false;
    }
    function nearestWork(ctx) {
      const s = ctx.s, start = ctx.loc, prev = { [start]: null }, q = [start];
      while (q.length) {
        const L = q.shift();
        if (L !== start && workAt(ctx, L)) {
          const path = []; for (let x = L; x !== start; x = prev[x]) path.unshift(x);
          return path.length <= 3 ? path : null;
        }
        for (const x of locations[L].exits(s)) {
          if (x in prev) continue;
          const lk = (LOCS[x] || {}).lock;
          if (lk && !s.unlocked[x] && !ctx.held(lk.key)) continue;
          if (P.door && x === P.door.outside) continue;
          prev[x] = L; q.push(x);
        }
      }
      return null;
    }
    function lampOpts(ctx, o) {
      const s = ctx.s;
      if (!s.fuelUsed && (ctx.visible(P.lamp.fuel) || ctx.held(P.lamp.fuel)) && ctx.visible(P.lamp.lamp)) o.push({ label: P.lamp.relight_label || `摸黑把${OBJS[P.lamp.lamp].name}重新点上`, steps: [{ type: 'use', target: P.lamp.fuel }] });
      else if (!s.fuelUsed && !ctx.visible(P.lamp.fuel) && !ctx.held(P.lamp.fuel)) {
        const fl = OBJS[P.lamp.fuel].loc;
        const ex = locations[ctx.loc].exits(s);
        if (ex.includes(fl)) o.push({ label: `摸黑去${LOCS[fl].name}拿${OBJS[P.lamp.fuel].name}`, steps: [{ type: 'move', target: fl }, { type: 'take', target: P.lamp.fuel }] });
      }
    }
    function stepFor(ctx, id, rv) {
      const parts = String(rv.when || '').split('+').map(x => x.trim());
      const topic = (parts.find(x => x.startsWith('topic:')) || '').slice(6);
      const show = (parts.find(x => x.startsWith('show:')) || '').slice(5);
      const give = (parts.find(x => x.startsWith('give:')) || '').slice(5);
      if (show) return ctx.held(show) ? { type: 'show', target: show, to: id } : null;
      if (give) return ctx.held(give) ? { type: 'give', target: give, to: id } : null;
      if (topic) return { type: 'say', to: id, text: (NPCS[id].topics || {})[topic] || topic, topic, flags: {} };
      return null;
    }
    function labelFor(id, st) {
      const N = NPCS[id];
      if (st.type === 'show') return `把${OBJS[st.target].name}给${N.name}看`;
      if (st.type === 'give') return `把${OBJS[st.target].name}交给${N.name}`;
      return `问${N.name}：${String((N.topics || {})[st.topic] || st.topic).replace(/^问(他|她)?/, '')}`;
    }

    /* ---------- 开场选项 ---------- */
    function openingOptions() {
      if (Array.isArray(D.opening_options) && D.opening_options.length) return D.opening_options;
      const out = [];
      for (const O of arr(D.objects)) {
        if (out.length >= 2) break;
        if (O.loc === D.start_loc && !O.hidden_until) out.push({ label: O.label || `看看${O.name}`, steps: [{ type: 'examine', target: O.id }] });
      }
      for (const x of arr((LOCS[D.start_loc] || {}).exits).slice(0, 2)) out.push({ label: LOCS[x].go_label || `去${LOCS[x].name}`, steps: [{ type: 'move', target: x }] });
      return out.slice(0, 4);
    }

    /* ---------- 结局 ---------- */
    const E = D.endings || {};
    const endings = {
      good: { title: E.good_title || '做对了', points: K.points, beat: E.good, echo: D.echo },
      partial: { title: E.partial_title || '熬过去了', points: Math.round(K.points * 0.3), beat: E.partial, echo: D.echo },
      bad: { title: E.bad_title || '有人替我付了', points: Math.round(K.points * 0.1), beat: E.bad, echo: D.echo },
    };
    if (E.warm) endings.warm = { title: E.warm_title || '做暖了', points: Math.round(K.points * 1.2), beat: E.warm, echo: D.echo };
    const deadBy = E.dead_by || {};
    function deathBeat(s, cause) {
      if (deadBy[cause]) return deadBy[cause];
      if (cause === 'tempt' && P.tempt && P.tempt.second_image) return P.tempt.second_image;
      return E.dead || '';
    }

    function spoilers() {
      return arr(D.spoilers).concat(accNames).filter(Boolean);
    }
    function sceneNote(s) {
      const a = [];
      if (P.lamp) a.push(s.lampLit ? `${OBJS[P.lamp.lamp].name}亮着。` : `${OBJS[P.lamp.lamp].name}灭了，屋里漆黑。`);
      if (s.solved) a.push(PZ.solved_scene || '那道题已经解开了，屋里静了。');
      if (s.blocked && Object.keys(s.blocked).length) a.push('有的路已经走不通了。');
      return a.join('');
    }
    function onEnter(ctx, to) { ctx.s.visited[to] = true; }

    const C = {
      id: D.id, title: D.title, star, role: D.identity, task: D.task,
      start: START, startLoc: D.start_loc, dawnHHMM: D.deadline,
      styleNote: D.style_note, opening: D.opening, openingOptions: openingOptions(),
      data: D,
      init() {
        return {
          solved: false, warm: false, wrong: 0, accepts: 0, tempts: 0, quietUntil: 0,
          lampLit: !!P.lamp, lampEnd: START + K.lampSpan, fuelUsed: false, dark: false, darkTurns: 0, darkCalmUntil: 0,
          doorOpened: 0, blocked: {}, unlocked: {}, stakeHeld: false, stakePaid: false,
          flags: {}, revealed: {}, asked: {}, visited: { [D.start_loc]: true },
          book: {}, bookText: '', submitted: false,
        };
      },
      initRun(run) { for (const c of arr(D.start_clues)) run.clues[c] = { turn: 0, at: START }; },
      locations, objects, npcs, flags, clues, timeline,
      act(ctx, st) {
        if (st.type === 'say' && st.to && NPCS[st.to] && st.topic) (ctx.s.asked[st.to] || (ctx.s.asked[st.to] = {}))[st.topic] = true;
        return act(ctx, st);
      },
      onMinute, check, canMove, onEnter, onIncense, onRevive,
      inCrisis: s => !!(s.dark && !s.solved),
      waitOption: s => ({ label: s.solved ? (D.wait_label_solved || '守着，等天亮') : (D.wait_label || '守着，等下一桩事'), steps: [{ type: 'wait', until: D.deadline }] }),
      suggest, endings, deathBeat, spoilers, sceneNote,
      truth: D.truth,
      _kit: { cond, parseBook, bookOk, tm, K, P },
    };
    return C;
  }

  function parseClock(s) {
    const m = /^(\d{1,2})[:：](\d{2})$/.exec(String(s || '').trim());
    return m ? +m[1] * 60 + +m[2] : null;
  }

  return { compile, STAR, PRESSURE_KEYS };
})();

(function loadNights() {
  const K = new TextEncoder().encode('yebuguiren-2026');
  for (const id of Object.keys(typeof NIGHT_BLOBS === 'object' ? NIGHT_BLOBS : {})) {
    try {
      const bin = atob(NIGHT_BLOBS[id]);
      const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ K[i % K.length];
      const data = JSON.parse(new TextDecoder().decode(u));
      data.id = data.id || id;
      registerCase(Kit.compile(data));
    } catch (e) { console.error('数据夜加载失败', id, e); }
  }
})();

'use strict';

/* OpenAI 兼容接口。测试时把 window.__MOCK_LLM 换成假模型。 */
const LLM = {
  async chat(messages, { json = true, temperature = 0.8, maxTokens = 1600, tag = '' } = {}) {
    if (typeof window !== 'undefined' && window.__MOCK_LLM) return window.__MOCK_LLM(messages, { json, tag });
    const cfg = App.cfg;
    if (!cfg.key) throw new LLMError('还没填模型的 key。到「设置」里填一下。', 'nokey');
    const url = cfg.base.replace(/\/+$/, '').replace(/\/chat\/completions$/, '') + '/chat/completions';
    const body = { model: cfg.model, messages, temperature, max_tokens: maxTokens };
    if (json) body.response_format = { type: 'json_object' };
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), 90000);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
          body: JSON.stringify(body),
          signal: ac.signal,
        });
        clearTimeout(timer);
        if (res.status === 401 || res.status === 403) throw new LLMError('key 不对，或者没有权限。', 'auth');
        if (res.status === 400 && body.response_format && attempt === 0) { delete body.response_format; continue; }
        if (!res.ok) { lastErr = new LLMError(`模型接口出错（${res.status}）。`, 'http'); if (res.status >= 500 || res.status === 429) { await sleep(1200 * (attempt + 1)); continue; } throw lastErr; }
        const data = await res.json();
        const text = data?.choices?.[0]?.message?.content || '';
        LLM.lastRaw = text;
        if (!text.trim()) { lastErr = new LLMError('模型回了空话。', 'empty'); continue; }
        if (!json) return text;
        const obj = extractJSON(text);
        if (!obj) { console.warn('读不懂的回复', text); lastErr = new LLMError('模型回的不是能读的格式。', 'parse'); body.temperature = Math.max(0, (body.temperature || 0) - 0.1); continue; }
        return obj;
      } catch (e) {
        clearTimeout(timer);
        if (e instanceof LLMError && e.code === 'auth') throw e;
        lastErr = e.name === 'AbortError' ? new LLMError('模型太久没回话。', 'timeout') : (e instanceof LLMError ? e : new LLMError('连不上模型接口：' + (e.message || e), 'net'));
        await sleep(800 * (attempt + 1));
      }
    }
    throw lastErr || new LLMError('模型没有回应。', 'unknown');
  },
};

class LLMError extends Error {
  constructor(msg, code) { super(msg); this.code = code; }
}
